<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Team Room | Use Superintelligence</title>
<meta name="description" content="Your 3 AI agents working together on one project. Free, no sign-up.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#070914; --s2:#0E1220; --edge:#3a4459; --ink:#E9EDFF; --mist:#9AA3B8; --eb:#2F6BFF; --eb2:#5aa2ff;
    --sans:"Manrope","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font:400 1rem/1.5 var(--sans); -webkit-text-size-adjust:100%;
    background-image:linear-gradient(#1a223633 1px, transparent 1px), linear-gradient(90deg, #1a223633 1px, transparent 1px); background-size:24px 24px; }
  .room { display:flex; flex-direction:column; height:100dvh; max-width:820px; margin:0 auto; padding:0 16px; }
  header { flex:none; padding:14px 0 12px; text-align:center; border-bottom:1px solid #1f2840; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .top a, .top button { font:600 .8rem/1 var(--sans); color:var(--mist); text-decoration:none; background:none; border:1px solid var(--edge); border-radius:999px; padding:8px 12px; cursor:pointer; }
  .top a:hover, .top button:hover { color:var(--ink); border-color:var(--eb2); }
  .cube { width:54px; height:54px; object-fit:contain; filter:drop-shadow(0 0 8px #2F6BFF88); animation:float 5s ease-in-out infinite; }
  .cube.busy { animation:float 5s ease-in-out infinite, busy .5s ease-in-out infinite; }
  @keyframes float { 50% { transform:translateY(-3px); } }
  @keyframes busy { 50% { filter:drop-shadow(0 0 18px #9fd2ff) brightness(1.15); } }
  h1 { margin:6px 0 10px; font:800 1.35rem/1.1 var(--sans); letter-spacing:-.01em; }
  .crew { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; }
  .mem { --c:#5aa2ff; display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:999px; border:1px solid color-mix(in srgb, var(--c) 55%, transparent);
    background:color-mix(in srgb, var(--c) 10%, #0b1020); font:600 .8rem/1 var(--sans); transition:box-shadow .3s; }
  .mem i { width:7px; height:7px; border-radius:50%; background:var(--c); }
  .mem.talk { box-shadow:0 0 0 1px var(--c), 0 0 16px color-mix(in srgb, var(--c) 40%, transparent); }
  .note { margin:10px 0 0; font:600 .68rem/1.3 var(--mono); letter-spacing:.04em; color:#ffb86b; }
  #log { flex:1; overflow-y:auto; padding:18px 0; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:86%; padding:12px 14px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; animation:in .3s ease-out; }
  @keyframes in { from { opacity:0; transform:translateY(6px); } }
  .you { align-self:flex-end; background:#16213a; border:1px solid #2F6BFF77; border-bottom-right-radius:4px; }
  .bot { --c:#5aa2ff; align-self:flex-start; background:color-mix(in srgb, var(--c) 7%, #0c111e); border:1px solid #ffffff14; border-left:3px solid var(--c); border-bottom-left-radius:4px; }
  .who { display:block; margin-bottom:4px; font:600 .66rem/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--c); }
  .dots span { display:inline-block; width:6px; height:6px; margin-right:4px; border-radius:50%; background:var(--c); animation:dot 1s infinite; }
  .dots span:nth-child(2) { animation-delay:.15s; } .dots span:nth-child(3) { animation-delay:.3s; }
  @keyframes dot { 50% { opacity:.25; transform:translateY(-2px); } }
  .empty { margin:auto; max-width:420px; text-align:center; color:var(--mist); font:500 .95rem/1.5 var(--sans); }
  .empty b { display:block; margin-bottom:6px; color:var(--ink); font:700 1.05rem/1.3 var(--sans); }
  .ideas { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:14px; }
  .ideas button { font:600 .8rem/1.2 var(--sans); color:var(--ink); background:#ffffff0a; border:1px solid #ffffff22; border-radius:999px; padding:9px 13px; cursor:pointer; }
  .ideas button:hover { border-color:var(--eb2); }
  form { flex:none; display:flex; gap:8px; padding:12px 0 calc(14px + env(safe-area-inset-bottom)); border-top:1px solid #1f2840; }
  textarea { flex:1; min-width:0; resize:none; max-height:140px; padding:12px 16px; font:500 1rem/1.4 var(--sans); color:var(--ink); background:#ffffff0d; border:1px solid #ffffff26; border-radius:22px; }
  textarea:focus { outline:none; border-color:var(--eb2); }
  form button { flex:none; padding:0 20px; font:700 .9rem/1 var(--sans); color:#fff; background:var(--eb); border:0; border-radius:999px; cursor:pointer; }
  form button:disabled { opacity:.5; }
  .none { margin:auto; text-align:center; color:var(--mist); }
  .none a { color:var(--eb2); }
  @media (prefers-reduced-motion:reduce) { .cube, .msg, .dots span { animation:none !important; } }
</style>
</head>
<body>
<div class="room">
  <header>
    <div class="top">
      <a href="agent-hub-circuit-test.html">← Agent Hub</a>
      <img class="cube" id="cube" src="brand/logo-cube-v2.png" alt="" width="54" height="54">
      <button type="button" id="clear">New project</button>
    </div>
    <h1>Team Room</h1>
    <div class="crew" id="crew"></div>
    <p class="note" id="note" hidden>TEST PREVIEW · real answers appear on the live site</p>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="f" autocomplete="off">
    <textarea id="q" rows="1" placeholder="Give your team one goal…" aria-label="Message your team"></textarea>
    <button type="submit" id="send">Send</button>
  </form>
</div>
<script>
(function () {
  var LIVE = /(^|\.)usesuperintelligence\.com$/.test(location.hostname);
  var $ = function (id) { return document.getElementById(id); };
  var log = $("log"), form = $("f"), input = $("q"), btn = $("send"), cube = $("cube");
  var team = [];
  try { team = JSON.parse(localStorage.getItem("usi_team_info") || "[]") || []; } catch (e) { team = []; }
  team = team.filter(function (m) { return m && m.href && m.name; }).slice(0, 3);
  team.forEach(function (m) { m.id = String(m.href).split("/").filter(Boolean).pop(); });
  if (!LIVE) $("note").hidden = false;

  if (!team.length) {
    log.innerHTML = '<div class="none"><b>No team yet.</b><br>Go to the <a href="agent-hub-circuit-test.html">Agent Hub</a>, tap 👁 on any agent and choose "Add to My Team".</div>';
    form.hidden = true; $("clear").hidden = true; return;
  }

  var crew = $("crew");
  team.forEach(function (m, i) {
    var s = document.createElement("span"); s.className = "mem"; s.style.setProperty("--c", m.col || "#5aa2ff");
    s.innerHTML = "<i></i>"; s.appendChild(document.createTextNode(m.name)); crew.appendChild(s); m.el = s;
  });

  var KEY = "usi_room_" + team.map(function (m) { return m.id; }).join("_");
  var hist = []; // {role:"user"|"agent", id, text}
  try { hist = JSON.parse(localStorage.getItem(KEY) || "[]") || []; } catch (e) { hist = []; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(hist.slice(-40))); } catch (e) {} }
  function find(id) { for (var i = 0; i < team.length; i++) if (team[i].id === id) return team[i]; return null; }

  function bubble(h) {
    var d = document.createElement("div");
    if (h.role === "user") { d.className = "msg you"; d.textContent = h.text; }
    else { var m = find(h.id) || { name: "Agent", col: "#5aa2ff" }; d.className = "msg bot"; d.style.setProperty("--c", m.col);
      var w = document.createElement("span"); w.className = "who"; w.textContent = m.name + " · " + (m.cat || ""); d.appendChild(w); d.appendChild(document.createTextNode(h.text)); }
    log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
  }
  function render() {
    log.innerHTML = "";
    if (!hist.length) {
      var e = document.createElement("div"); e.className = "empty";
      e.innerHTML = "<b>Your team is ready.</b>Give them one goal. Each agent answers from its own specialty.";
      var ideas = document.createElement("div"); ideas.className = "ideas";
      ["Help me launch a small business", "Plan my week so I get more done", "I want a better job this year"].forEach(function (t) {
        var b = document.createElement("button"); b.type = "button"; b.textContent = t; b.onclick = function () { send(t); }; ideas.appendChild(b); });
      e.appendChild(ideas); log.appendChild(e); return;
    }
    hist.forEach(bubble);
  }

  // what one agent sees: the user's messages plus its own earlier replies; the newest message carries team context
  function messagesFor(m) {
    var others = team.filter(function (x) { return x !== m; }).map(function (x) { return x.name; }).join(" and ");
    var out = [];
    hist.forEach(function (h) {
      if (h.role === "user") out.push({ role: "user", content: h.text });
      else if (h.id === m.id) out.push({ role: "assistant", content: h.text });
    });
    // merge consecutive user turns
    var merged = []; out.forEach(function (x) { var l = merged[merged.length - 1]; if (l && l.role === x.role) l.content += "\n" + x.content; else merged.push({ role: x.role, content: x.content }); });
    var last = merged[merged.length - 1];
    if (last && last.role === "user") last.content = ("[Team Room: you work together with " + (others || "no one else") + ". Answer only the part of this goal that fits your specialty, in under 120 words, with clear next steps.]\n" + last.content).slice(0, 1500);
    return merged.slice(-10);
  }

  async function ask(m) {
    if (!LIVE) {
      await new Promise(function (r) { setTimeout(r, 900); });
      return "(Preview) " + m.name + " would answer here from the " + (m.cat || "its") + " side. Real answers appear when this page is on the live site.";
    }
    var res = await fetch("/api/agent", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ agent: m.id, messages: messagesFor(m) }) });
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok || !data.text) throw new Error(data.error || "The agent couldn't answer right now.");
    return data.text;
  }

  var busy = false;
  async function send(text) {
    text = String(text || "").trim(); if (!text || busy) return;
    busy = true; btn.disabled = true; cube.classList.add("busy");
    if (!hist.length) log.innerHTML = "";
    var h = { role: "user", text: text.slice(0, 1200) }; hist.push(h); save(); bubble(h);
    input.value = ""; input.style.height = "auto";
    for (var i = 0; i < team.length; i++) {
      var m = team[i]; m.el.classList.add("talk");
      var wait = document.createElement("div"); wait.className = "msg bot"; wait.style.setProperty("--c", m.col);
      wait.innerHTML = '<span class="who"></span><span class="dots"><span></span><span></span><span></span></span>'; wait.firstChild.textContent = m.name + " · " + (m.cat || "");
      log.appendChild(wait); log.scrollTop = log.scrollHeight;
      var reply;
      try { reply = await ask(m); } catch (e) { reply = String(e.message || e); }
      wait.remove(); m.el.classList.remove("talk");
      var r = { role: "agent", id: m.id, text: reply }; hist.push(r); save(); bubble(r);
      if (/resting for today/i.test(reply)) break;
    }
    busy = false; btn.disabled = false; cube.classList.remove("busy"); input.focus();
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); send(input.value); });
  input.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); } });
  input.addEventListener("input", function () { input.style.height = "auto"; input.style.height = Math.min(140, input.scrollHeight) + "px"; });
  $("clear").addEventListener("click", function () { if (busy) return; hist = []; save(); render(); });
  render();
})();
</script>
</body>
</html>
