<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Agent Panel A Options (TEST)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --sans:"Manrope",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --ink:#E9EDFF; --dim:#9AA3B8; --bg:#05070f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); }
  .wrap { max-width:1180px; margin:0 auto; padding:20px 16px 60px; }
  .pick { display:flex; gap:8px; margin:0 0 6px; flex-wrap:wrap; }
  .pick button { font:700 .7rem/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; padding:11px 14px; border-radius:12px; cursor:pointer; color:var(--dim); background:#ffffff08; border:1px solid #ffffff1a; }
  .pick button[aria-pressed="true"] { color:#F0C674; background:#4d371b88; border-color:#d3ac62aa; }
  .note { margin:0 0 18px; color:var(--dim); font-size:.85rem; }
  .k { font:700 .62rem/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  .led { display:inline-block; width:7px; height:7px; border-radius:50%; background:#3ddc97; box-shadow:0 0 8px #3ddc97; }
  a { color:inherit; text-decoration:none; }
  @keyframes sweep { 0%,100% { transform:translateX(-60%); } 50% { transform:translateX(60%); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes blink { 50% { opacity:.35; } }
  @keyframes scan { 0% { top:0; } 100% { top:100%; } }
  .line { position:absolute; left:0; right:0; top:0; height:2px; background:linear-gradient(90deg,transparent,var(--a),transparent); animation:sweep 3s ease-in-out infinite; pointer-events:none; }
  .view[hidden] { display:none; }

  /* ===== A: MISSION CONTROL ===== */
  .A { position:relative; overflow:hidden; display:grid; grid-template-columns:230px 1fr; border-radius:18px; border:1px solid #ffffff18; background:linear-gradient(180deg,#0c1224,#070a14); }
  .A-side { padding:16px 10px; border-right:1px solid #ffffff12; background:#060914; }
  .A-side .k { display:block; padding:0 8px 10px; }
  .A-team { width:100%; display:flex; align-items:center; gap:10px; padding:10px; margin-bottom:4px; border-radius:10px; border:1px solid transparent; background:none; color:var(--dim); cursor:pointer; font:600 .86rem/1 var(--sans); text-align:left; }
  .A-team i { width:8px; height:8px; border-radius:50%; background:var(--a); box-shadow:0 0 8px var(--a); }
  .A-team b { margin-left:auto; font:700 .62rem/1 var(--mono); color:#7d869c; }
  .A-team[aria-pressed="true"] { color:var(--ink); border-color:color-mix(in srgb,var(--a) 50%,transparent); background:color-mix(in srgb,var(--a) 10%,transparent); }
  .A-main { position:relative; padding:16px; min-width:0; }
  .A-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .A-stat { position:relative; overflow:hidden; padding:12px 14px; border-radius:12px; border:1px solid #ffffff12; background:#0a0f1e; }
  .A-stat b { display:block; margin-top:8px; font:800 1.5rem/1 var(--sans); color:var(--a); text-shadow:0 0 16px color-mix(in srgb,var(--a) 50%,transparent); }
  .A-head, .A-row { display:grid; grid-template-columns:78px minmax(0,1.1fr) minmax(0,2fr) 92px 80px; gap:12px; align-items:center; }
  .A-head { padding:0 12px 8px; border-bottom:1px solid #ffffff12; }
  .A-row { padding:12px; border-bottom:1px solid #ffffff0c; border-radius:10px; transition:background .2s; }
  .A-row:hover { background:color-mix(in srgb,var(--a) 8%,transparent); }
  .A-id { font:500 .66rem/1 var(--mono); color:#7d869c; letter-spacing:.06em; }
  .A-nm { font-weight:800; font-size:.95rem; }
  .A-bl { color:#B8C1D6; font-size:.82rem; line-height:1.35; }
  .A-st { display:flex; align-items:center; gap:6px; font:700 .6rem/1 var(--mono); letter-spacing:.12em; color:#7CF0BE; }
  .A-st .led { animation:blink 2.4s ease-in-out infinite; }
  .A-go { justify-self:end; font:700 .6rem/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; padding:8px 10px; border-radius:9px; color:#F0C674; background:#4d371b66; border:1px solid #d3ac6288; }
  @media (max-width:760px) {
    .A { grid-template-columns:1fr; }
    .A-side { display:flex; gap:6px; overflow-x:auto; padding:12px; border-right:0; border-bottom:1px solid #ffffff12; scrollbar-width:none; }
    .A-side .k { display:none; }
    .A-team { flex:none; width:auto; margin:0; }
    .A-head { display:none; }
    .A-row { grid-template-columns:1fr auto; grid-template-areas:"nm go" "bl go" "id st"; gap:4px 10px; }
    .A-id { grid-area:id; } .A-nm { grid-area:nm; } .A-bl { grid-area:bl; } .A-st { grid-area:st; justify-self:end; } .A-go { grid-area:go; }
    .A-stat b { font-size:1.2rem; }
  }

  /* ===== A variants (pills) ===== */
  .A-st .sig, .A-go svg { display:none; }
  .A-go { display:inline-flex; align-items:center; gap:6px; }
  .A-go svg { width:14px; height:14px; }

  /* A1 Glass Capsules */
  .v1 .A-team { border-radius:999px; padding:10px 14px; }
  .v1 .A-team[aria-pressed="true"] { background:linear-gradient(180deg,#ffffff14,#ffffff05); border-color:#ffffff30; box-shadow:inset 0 1px 0 #ffffff26, 0 0 18px -6px var(--a); }
  .v1 .A-team b { padding:3px 7px; border-radius:999px; background:#ffffff10; color:var(--ink); }
  .v1 .A-stat { border-radius:999px; padding:12px 20px; background:linear-gradient(180deg,#ffffff0d,#ffffff03); border-color:#ffffff1f; box-shadow:inset 0 1px 0 #ffffff1f; }
  .v1 .A-stat b { display:inline; margin:0 0 0 8px; font-size:1.2rem; }
  .v1 .A-row { border-radius:16px; }
  .v1 .A-st { justify-self:start; padding:6px 10px; border-radius:999px; background:#3ddc9714; border:1px solid #3ddc9740; box-shadow:inset 0 1px 0 #ffffff14; letter-spacing:.08em; }
  .v1 .A-go { border-radius:999px; padding:9px 14px; color:#05070f; background:linear-gradient(120deg, var(--a), color-mix(in srgb,var(--a) 55%,#fff)); border:0; box-shadow:0 0 16px -4px var(--a); }

  /* A2 Neon Tags */
  .v2 .A-team { border-radius:0; clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px)); border-left:3px solid transparent; }
  .v2 .A-team[aria-pressed="true"] { border:1px solid var(--a); border-left:3px solid var(--a); background:color-mix(in srgb,var(--a) 14%,transparent); box-shadow:inset 0 0 14px -4px var(--a); }
  .v2 .A-team b { color:var(--a); }
  .v2 .A-stat { border-radius:0; clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%); border-color:color-mix(in srgb,var(--a) 50%,transparent); }
  .v2 .A-row { border-radius:0; border-left:2px solid transparent; }
  .v2 .A-row:hover { border-left-color:var(--a); }
  .v2 .A-st { justify-self:start; padding:6px 10px; clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%); background:#3ddc971f; color:#7CF0BE; text-transform:uppercase; }
  .v2 .A-st .led { border-radius:1px; width:10px; height:4px; }
  .v2 .A-go { padding:9px 14px; border-radius:0; clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%); color:var(--a); background:color-mix(in srgb,var(--a) 14%,transparent); border:0; box-shadow:inset 0 0 0 1px var(--a); text-shadow:0 0 8px var(--a); }

  /* A3 Color Chips */
  .v3 .A-team { border-radius:999px; padding:9px 12px; }
  .v3 .A-team i { display:none; }
  .v3 .A-team b { order:-1; margin:0; min-width:24px; height:24px; display:grid; place-items:center; border-radius:50%; background:color-mix(in srgb,var(--a) 22%,transparent); color:var(--a); }
  .v3 .A-team[aria-pressed="true"] { background:var(--a); color:#05070f; box-shadow:0 0 20px -4px var(--a); }
  .v3 .A-team[aria-pressed="true"] b { background:#05070f; color:var(--a); }
  .v3 .A-stat { border-radius:18px; background:linear-gradient(135deg,color-mix(in srgb,var(--a) 22%,#0a0f1e),#0a0f1e 70%); border-color:color-mix(in srgb,var(--a) 40%,transparent); }
  .v3 .A-row { border-radius:14px; }
  .v3 .A-st { justify-self:start; padding:6px 10px 6px 8px; border-radius:999px; background:#3ddc97; color:#05221a; letter-spacing:.06em; }
  .v3 .A-st .led { display:none; }
  .v3 .A-st .sig { display:inline-flex; align-items:flex-end; gap:2px; height:10px; }
  .v3 .A-st .sig i { width:3px; border-radius:1px; background:#05221a; animation:blink 1.8s ease-in-out infinite; }
  .v3 .A-st .sig i:nth-child(1) { height:4px; } .v3 .A-st .sig i:nth-child(2) { height:7px; animation-delay:.3s; } .v3 .A-st .sig i:nth-child(3) { height:10px; animation-delay:.6s; }
  .v3 .A-go { justify-self:end; width:38px; height:38px; padding:0; border-radius:50%; justify-content:center; background:var(--a); color:#05070f; border:0; box-shadow:0 0 16px -3px var(--a); transition:transform .2s; }
  .v3 .A-go .tx { display:none; } .v3 .A-go svg { display:block; width:16px; height:16px; }
  .v3 .A-row:hover .A-go { transform:translateX(3px); }
  .v3 .A-head, .v3 .A-row { grid-template-columns:78px minmax(0,1.1fr) minmax(0,2fr) 92px 44px; }
  @media (max-width:760px) { .v3 .A-head, .v3 .A-row { grid-template-columns:1fr auto; } }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; } }
</style>
</head><body>
<div class="wrap">

    <button type="button" data-v="1" aria-pressed="true">A1 · Glass Capsules</button>
    <button type="button" data-v="2" aria-pressed="false">A2 · Neon Tags</button>
    <button type="button" data-v="3" aria-pressed="false">A3 · Color Chips</button>

</div>
<script>
(function () {
  var D = [["resume","Resume Helper","Career","Turns your experience into a strong, results-focused resume."],["cover-letter","Cover Letter Writer","Career","Writes a tailored cover letter in minutes."],["interview-coach","Interview Coach","Career","Practice interviews with feedback on every answer."],["linkedin","LinkedIn Profile Pro","Career","Writes a headline and About section that get noticed."],["salary-negotiator","Salary Negotiator","Career","Helps you ask for more money with confidence."],["career-switch","Career Switch Guide","Career","Maps a realistic path into a new career."],["job-search","Job Search Planner","Career","Builds a weekly plan to land interviews faster."],["networking","Networking Messages","Career","Writes friendly outreach that people actually answer."],["reference-letter","Recommendation Letter Writer","Career","Drafts recommendation and reference letters."],["resignation","Resignation Letter Writer","Career","Leave your job gracefully, on good terms."],["business","Business Idea Lab","Business","Brainstorms ideas and checks if they can really work."],["business-plan","Business Plan Builder","Business","Creates a clear one-page business plan."],["pitch","Pitch Coach","Business","Sharpens your pitch for investors, partners or customers."],["pricing","Pricing Strategist","Business","Helps you set prices that sell and make a profit."],["customer-persona","Customer Persona Maker","Business","Describes exactly who your ideal customer is."],["competitor","Competitor Analyzer","Business","Finds how to stand out from the competition."],["names","Brand Name Generator","Business","Creates memorable names and taglines."],["side-hustle","Side Hustle Finder","Business","Finds side income ideas that fit your skills and time."],["customer-service","Customer Reply Writer","Business","Writes calm, professional replies to customers."],["sop","Process & SOP Writer","Business","Turns how you work into clear step-by-step guides."],["social","Social Post Writer","Marketing","Writes scroll-stopping posts, captions and hooks."],["video-script","Short Video Scripter","Marketing","Scripts Reels, TikToks and Shorts that keep people watching."],["seo","SEO Helper","Marketing","Helps your website rank higher on Google."],["blog","Blog Post Writer","Marketing","Outlines and writes helpful blog posts."],["ad-copy","Ad Copywriter","Marketing","Writes ads for Facebook, Instagram and Google."],["newsletter","Newsletter Writer","Marketing","Writes engaging email newsletters people open."],["product-description","Product Description Writer","Marketing","Writes product descriptions that sell."],["brand-voice","Brand Voice Builder","Marketing","Defines how your brand sounds everywhere."],["landing-page","Landing Page Copywriter","Marketing","Writes the words for a page that converts visitors."],["slogan","Slogan Generator","Marketing","Creates catchy slogans and taglines."],["email","Email Writer","Writing","Drafts clear, polite emails for any situation."],["proofreader","Proofreader","Writing","Fixes grammar, spelling and clarity, and explains why."],["rewriter","Tone Changer","Writing","Rewrites text to sound more professional, friendly or confident."],["summarizer","Summarizer","Writing","Turns long text into a short, clear summary."],["story","Story Writer","Writing","Writes short stories in any genre, together with you."],["poem","Poem Writer","Writing","Writes original poems for any moment."],["speech","Speech Writer","Writing","Writes speeches and toasts that land."],["essay-outline","Essay Outliner","Writing","Builds a clear thesis and outline for any essay."],["simplifier","Plain English","Writing","Turns confusing text into simple words anyone understands."],["translator","Translator","Writing","Translates naturally between languages."],["tutor","Study Tutor","Learning","Explains any school topic simply, step by step."],["math","Math Tutor","Learning","Solves math step by step so you actually understand it."],["essay-coach"," ."],["money-basics","Money Explainer","Money","Explains credit scores, interest and money terms simply."],["investing-basics","Investing Basics","Money","Explains how investing works, without the jargon."],["tax-basics","Tax Basics Explainer","Money","Explains US tax terms and forms in plain English."],["frugal","Frugal Living Tips","Money","Practical ways to spend less and live well."],["big-purchase","Big Purchase Helper","Money","Helps you buy smart: cars, laptops, appliances and more."],["bill-negotiator","Bill Negotiator","Money","Scripts to lower your bills and fees."],["retirement-basics","Retirement Basics","Money","Explains 401(k)s, IRAs and planning for later."],["meal-planner","Meal Planner","Life","Plans a week of meals and a shopping list."],["chef","Recipe Chef","Life","Turns what's in your fridge into a delicious meal."],["fitness","Workout Planner","Life","Creates workouts for your goals and equipment."],["sleep","Sleep Coach","Life","Helps you fall asleep faster and wake up rested."],["habits","Habit Builder","Life","Builds good habits that actually stick."],["mindful","Calm & Mindfulness","Life","Guided breathing and calming exercises for stressful moments."],["travel","Travel Planner","Life","Plans trips with itineraries, budgets and tips."],["gifts","Gift Idea Finder","Life","Finds thoughtful gifts for anyone, any budget."],["home","Home Organizer","Life","Plans cleaning routines and decluttering projects."],["pets","Pet Care Helper","Life","Answers everyday questions about dogs, cats and more."],["code","Code Helper","Tech","Writes and explains code in any language."],["debug","Bug Fixer","Tech","Finds and fixes errors in your code."],["learn-code","Learn to Code Mentor","Tech","Teaches coding from zero, one small step at a time."],["sql","SQL Helper","Tech","Writes database queries from plain English."],["website","Website Builder","Tech","Creates simple web pages with HTML and CSS."],["tech-support","Tech Support","Tech","Fixes everyday phone,   var COL = ["#3ddc97","#f0c674","#ff6b9d","#b48cff","#4fd1ff","#ffa24c","#9be15d","#ff7a6b","#22e3c4","#ffd84d"];
  var NOTES = { 1: "Soft round glass pills everywhere. Calm and premium, like Apple-style controls.",

  function esc(s) { return String(s).replace(/[&<>"]/g, function (m) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]; }); }
  var by = {}; CATS.forEach(function (c) { by[c] = []; });
  D.forEach(function (a, i) { a.push("USI-" + String(i + 1).padStart(3, "0")); by[a[2]].push(a); });
  function url(a) { return "https://usesuperintelligence.com/agents/" + a[0]; }
