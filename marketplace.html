<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Creator Marketplace · Use Superintelligence</title>
<meta name="description" content="The Use Superintelligence Creator Marketplace: AI agents, tools, prompts, creative assets, courses and digital products from independent creators.">
<meta name="theme-color" content="#070914">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--void:#070914;--deep:#05060F;--panel:#0E1226;--navy:#0A1640;--line:#232A4A;--ink:#E9EDFF;--mist:#9AA3C7;--aether:#7FE0FF;--ice:#9FE3FF;--gold:#F0C674;--signal:#3D7BFF;
 --glass:rgba(14,18,38,.72);--edge:rgba(127,224,255,.72);--edge-soft:rgba(127,224,255,.32);--gold-edge:rgba(240,198,116,.22);--glow:0 0 24px rgba(127,224,255,.22)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#veil{position:fixed;inset:0;background:var(--void);z-index:9;pointer-events:none;transition:opacity 1.4s ease}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.2);backdrop-filter:blur(24px) saturate(1.2);border:1px solid var(--edge-soft);box-shadow:var(--glow),inset 0 0 0 1px var(--gold-edge)}
button{font:inherit;color:inherit;cursor:pointer}
/* Header */
#top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));z-index:4;pointer-events:none}
#top>*{pointer-events:auto}
#brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
#brand svg{width:22px;height:22px;flex:none}
#brand b{font:600 clamp(19px,2.6vw,26px)/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.01em;background:linear-gradient(90deg,var(--aether),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
#brand span{font:600 10.5px/1 Manrope,system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--mist);padding-left:10px;border-left:1px solid var(--line)}
#back{font:600 11px/1 Manrope,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--mist);text-decoration:none;padding:11px 15px;border-radius:99px;transition:color .3s,border-color .3s}
#back:hover,#back:focus-visible{color:var(--ink);border-color:var(--edge);outline:none}
/* Floating portal labels */
#labels{position:fixed;inset:0;pointer-events:none;z-index:2}
.plabel{position:absolute;left:0;top:0;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;pointer-events:auto;cursor:pointer;opacity:0;transition:opacity .25s;padding:6px 8px}
.plabel i{display:block;font:600 9.5px/1 Manrope,system-ui,sans-serif;font-style:normal;letter-spacing:.3em;color:var(--gold);opacity:.85;margin-bottom:5px}
.plabel b{font:500 clamp(14px,1.55vw,19px)/1.1 'Cormorant Garamond',Georgia,serif;color:var(--ink);letter-spacing:.015em;text-shadow:0 0 14px rgba(127,224,255,.55),0 1px 2px rgba(0,0,0,.8)}
/* Focus card */
#card{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 62px);transform:translate(-50%,16px);width:min(440px,calc(100% - 28px));padding:20px 22px 18px;border-radius:20px;z-index:4;opacity:0;pointer-events:none;transition:opacity .45s ease,transform .45s ease}
#card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#card .idx{font:600 10px/1 Manrope,system-ui,sans-serif;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
#card h2{margin:9px 0 6px;font:500 clamp(28px,4.2vw,38px)/1.05 'Cormorant Garamond',Georgia,serif;color:var(--ink);letter-spacing:.005em}
#card p{margin:0 0 16px;font:400 15px/1.5 Manrope,system-ui,sans-serif;color:var(--mist)}
#card .row{display:flex;align-items:center;gap:10px}
.round{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--edge-soft);background:rgba(10,22,64,.45);font-size:18px;line-height:1;display:grid;place-items:center;transition:border-color .3s,background .3s}
.round:hover,.round:focus-visible{border-color:var(--edge);background:rgba(61,123,255,.18);outline:none}
#enter{flex:1;height:44px;border-radius:99px;border:1px solid rgba(127,224,255,.55);background:linear-gradient(90deg,rgba(61,123,255,.85),rgba(127,224,255,.55));font:700 12px/1 Manrope,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#fff;box-shadow:0 0 20px rgba(61,123,255,.35);transition:filter .3s}
#enter:hover,#enter:focus-visible{filter:brightness(1.15);outline:none}
#atrium{position:absolute;top:14px;right:14px;width:34px;height:34px;font-size:15px}
/* Category chips */
#chips{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:flex-start;overflow-x:auto;padding:4px max(14px,env(safe-area-inset-left)) 4px;z-index:4;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#chips::-webkit-scrollbar{display:none}
#chips button:first-child{margin-left:auto}#chips button:last-child{margin-right:auto} /* centred when it fits, scrolls from the first chip when it doesn't */
#chips button{flex:none;height:38px;padding:0 15px;border-radius:99px;font:600 10.5px/1 Manrope,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);white-space:nowrap;transition:color .3s,border-color .3s,background .3s}
#chips button:hover,#chips button:focus-visible{color:var(--ink);outline:none;border-color:var(--edge)}
#chips button.on{color:var(--ink);border-color:var(--edge);background:rgba(61,123,255,.22)}
/* Hint, toast, fps, error */
#hint{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 62px);transform:translateX(-50%);font:600 10.5px/1 Manrope,system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--mist);opacity:0;transition:opacity 1s;z-index:3;pointer-events:none;white-space:nowrap;text-shadow:0 1px 3px #000}
#hint.on{opacity:.75}
#toast{position:fixed;left:50%;top:calc(max(14px,env(safe-area-inset-top)) + 58px);transform:translate(-50%,-6px);padding:12px 18px;border-radius:14px;font:600 13px/1.3 Manrope,system-ui,sans-serif;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;z-index:6;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#fps{position:fixed;right:max(12px,env(safe-area-inset-right));top:calc(max(14px,env(safe-area-inset-top)) + 50px);z-index:7;font:600 11.5px/1.35 ui-monospace,Menlo,monospace;color:var(--ice);background:rgba(7,9,20,.78);border:1px solid rgba(127,224,255,.25);padding:7px 10px;border-radius:9px;pointer-events:none;white-space:pre}
#fps[hidden]{display:none}
#error{display:none;position:fixed;inset:0;place-items:center;text-align:center;padding:24px;font:italic 500 22px 'Cormorant Garamond',Georgia,serif;color:var(--mist);z-index:10}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:560px){#brand span{display:none}#card{padding:18px 18px 16px}#card p{font-size:14px;margin-bottom:14px}}
@media(prefers-reduced-motion:reduce){#card,#toast,.plabel,#veil{transition-duration:.01s}}
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="The Creator Marketplace atrium: a sapphire crystal surrounded by six category portals"></canvas>
<div id="labels" aria-hidden="true"></div>
<header id="top">
  <a id="brand" href="./marketplace.html" aria-label="Use Superintelligence Creator Marketplace">
    <svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FE0FF"/><stop offset="1" stop-color="#F0C674"/></linearGradient></defs><path d="M12 1.5 13.6 10.4 22.5 12 13.6 13.6 12 22.5 10.4 13.6 1.5 12 10.4 10.4Z" fill="none" stroke="url(#sg)" stroke-width="1.1"/><circle cx="12" cy="12" r="1.5" fill="#F0C674"/></svg>
    <b>Use Superintelligence</b><span>Marketplace</span>
  </a>
  <a id="back" class="glass" href="./index.html">← Universe</a>
</header>
<section id="card" class="glass" aria-live="polite" aria-hidden="true">
  <button id="atrium" class="round" aria-label="Back to the atrium" title="Back to the atrium">✕</button>
  <div class="idx" id="cIdx">01 / 06</div>
  <h2 id="cName"></h2>
  <p id="cLine"></p>
  <div class="row">
    <button id="prev" class="round" aria-label="Previous category">‹</button>
    <button id="enter">Enter gallery</button>
    <button id="next" class="round" aria-label="Next category">›</button>
  </div>
</section>
<nav id="chips" aria-label="Marketplace categories"></nav>
<div id="hint">Drag to look · Tap a portal</div>
<div id="toast" class="glass" role="status"></div>
<div id="fps" hidden></div>
<div id="error"></div>
<div id="veil"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="./marketplace/market.js"></script>
</body>
</html>
