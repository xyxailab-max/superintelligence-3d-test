 for(const sd of [-1,1]){const inl=new THREE.Mesh(new THREE.TorusGeometry(R,tube*.32,8,160),gGlow(glowC,.85,delay));inl.position.z=sd*tube*.82;g.add(inl)}
 const p=new Float32Array(nodes*6),se=new Float32Array(nodes*2);
 for(let i=0;i<nodes*2;i++){const k=i%nodes,ang=k/nodes*Math.PI*2;p[i*3]=Math.cos(ang)*R;p[i*3+1]=Math.sin(ang)*R;p[i*3+2]=(i<nodes?1:-1)*(tube+.05);se[i]=Math.random()}
 const ng=new THREE.BufferGeometry();ng.setAttribute('position',new THREE.BufferAttribute(p,3));ng.setAttribute('seed',new THREE.BufferAttribute(se,1));
 g.add(new THREE.Points(ng,nodeMat(nodeC,tube*1.6)));
 return {g,w:dir*Math.PI*2/period};
}
const rings=[
 gateRing(6.75,.30,platinum,'#7FE0FF','#7FE0FF',48,60,1,0,0),       // outer: platinum, neural blue, 60 s / rev
 gateRing(5.85,.20,moonstone,'#F0C674','#F0C674',36,85,-1,-.55,.25), // middle: moonstone, gold, 85 s / rev
 gateRing(4.75,.22,platinum,'#7FE0FF','#F0C674',24,110,1,.45,.5)     // inner: platinum, blue + gold, 110 s / rev
];
// Dial ticks on the outer ring (one instanced draw call).
(()=>{const n=36,im=new THREE.InstancedMesh(new THREE.BoxGeometry(.09,.55,.16),platinum,n),d=new THREE.Object3D();for(let i=0;i<n;i++){const ang=i/n*Math.PI*2,r=6.75+.3+.32;d.position.set(Math.cos(ang)*r,Math.sin(ang)*r,0);d.rotation.set(0,0,ang-Math.PI/2);d.updateMatrix();im.setMatrixAt(i,d.matrix)}rings[0].g.add(im)})();
// Threshold plate where the rings meet the causeway.
mesh(new THREE.BoxGeometry(15.2,.22,1.6),platinum,0,-.02,GATE.z);
mesh(new THREE.BoxGeometry(14.6,.03,.08),gGlow('#7FE0FF',.9,0),0,.11,GATE.z+.55);
mesh(new THREE.BoxGeometry(14.6,.03,.08),gGlow('#F0C674',.7,.25),0,.11,GATE.z-.55);
// Neural core: a dark crystal that awakens, a shell of synapse points and a faint neural web.
const core=new THREE.Group();gate.add(core);
const coreMat=new THREE.MeshStandardMaterial({color:'#0E1640',emissive:'#7FE0FF',emissiveIntensity:.08,metalness:.3,roughness:.25});
core.add(new THREE.Mesh(new THREE.IcosahedronGeometry(.62,1),coreMat));
(()=>{const n=coarse?110:160,p=new Float32Array(n*3),se=new Float32Array(n),pts=[];for(let i=0;i<n;i++){const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),ang=i*2.39996,R=1.15+Math.random()*.25;const v3=new THREE.Vector3(Math.cos(ang)*r*R,y*R,Math.sin(ang)*r*R);pts.push(v3);p[i*3]=v3.x;p[i*3+1]=v3.y;p[i*3+2]=v3.z;se[i]=Math.random()}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('seed',new THREE.BufferAttribute(se,1));core.add(new THREE.Points(g,nodeMat('#F0C674',.16)));
 const l=[];for(let i=0;i<n;i++){for(let j=i+1;j<n&&l.length<420;j++){if(pts[i].distanceTo(pts[j])<.55){l.push(pts[i].x,pts[i].y,pts[i].z,pts[j].x,pts[j].y,pts[j].z);break}}}
 const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(l),3));
 const lm=new THREE.LineBasicMaterial({color:'#7FE0FF',transparent:true,opacity:0,depthWrite:false});gateGlows.push({m:lm,base:.45,delay:.5});core.add(new THREE.LineSegments(lg,lm))})();
const gateLight=new THREE.PointLight('#7FE0FF',0,24,2);gate.add(gateLight);
// Neural particles drifting around the rings (one draw call, animated on the GPU).
(()=>{const n=coarse?360:640,pos=new Float32Array(n*3),d=new Float32Array(n*4);for(let i=0;i<n;i++){d[i*4]=Math.random()*Math.PI*2;d[i*4+1]=4.3+Math.random()*3.3;d[i*4+2]=(Math.random()-.5)*2.4;d[i*4+3]=(Math.random()<.5?-1:1)*(.03+Math.random()*.07)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('d',new THREE.BufferAttribute(d,4));
 const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:gateU,
  vertexShader:'uniform float uT,uS;attribute vec4 d;varying float vM,vTw;void main(){float ang=d.x+uT*d.w;float r=d.y+sin(uT*.7+d.x*3.)*.12;vec3 p=vec3(cos(ang)*r,sin(ang)*r,d.z);vM=fract(d.x*7.13);vTw=.6+.4*sin(uT*1.8+d.x*11.);vec4 mv=modelViewMatrix*vec4(p,1.);gl_PointSize=min(uS*.13/max(-mv.z,.1),28.);gl_Position=projectionMatrix*mv;}',
  fragmentShader:'uniform float uA;varying float vM,vTw;void main(){float q=length(gl_PointCoord-.5);float a=smoothstep(.5,0.,q);vec3 c=mix(vec3(.498,.878,1.),vec3(.941,.776,.455),step(.62,vM));gl_FragColor=vec4(c,a*uA*vTw*.7);}'});
 const o=new THREE.Points(g,m);o.frustumCulled=false;gate.add(o)})();
// Wordmark above the crown: Cormorant Garamond, blue-to-gold.
const wordCanvas=document.createElement('canvas');wordCanvas.width=2048;wordCanvas.height=256;
function drawWord(){const cx=wordCanvas.getContext('2d');cx.clearRect(0,0,2048,256);const gr=cx.createLinearGradient(300,0,1748,0);gr.addColorStop(0,'#7FE0FF');gr.addColorStop(1,'#F0C674');cx.fillStyle=gr;cx.font='600 132px "Cormorant Garamond", Georgia, serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('USE SUPERINTELLIGENCE'.split('').join('  '),1024,132)}
drawWord();const wordTex=new THREE.CanvasTexture(wordCanvas);wordTex.encoding=THREE.sRGBEncoding;wordTex.anisotropy=4;
const wordMat=gGlow('#ffffff',1,.5);wordMat.map=wordTex;
const word=new THREE.Mesh(new THREE.PlaneGeometry(13,1.625),wordMat);word.position.set(0,8.35,0);gate.add(word);
if(document.fonts&&document.fonts.load)document.fonts.load('600 132px "Cormorant Garamond"').then(()=>{drawWord();wordTex.needsUpdate=true}).catch(()=>{});
// Rings block walking except through the clear opening.
function blocked(x,z){return Math.abs(z-GATE.z)<1.25&&Math.abs(x-GATE.x)>3.0&&Math.abs(x-GATE.x)<7.9}

// ================= First-person explorer =================
const EYE=1.7,INTRO=8,START_Z=34,END_Z=-2;
const P={x:0,z:START_Z,yaw:0,pitch:.04,yawT:0,pitchT:.04,phase:0};
let chosen=false,cinematic=false,cinemaT=0,walk={x:0,y:0},selected=null,awake=.35,awakeTarget=.35;const clock=new THREE.Clock();
camera.rotation.order='YXZ';
const KZ=[46,31,22,6,END_Z],KY=[2.6,2.1,EYE,EYE,EYE],KP=[.10,.14,.16,.06,.03];
function track(k,T){const n=k.length-1,s=Math.min(Math.max(T/2,0),n-1e-6),i=Math.floor(s),u=s-i,m0=i>0?(k[i+1]-k[i-1])/2:0,m1=i+1<n?(k[i+2]-k[i])/2:0,u2=u*u,u3=u2*u;return(2*u3-3*u2+1)*k[i]+(u3-2*u2+u)*m0+(-2*u3+3*u2)*k[i+1]+(u3-u2)*m1}
const smooth=(a,b,x)=>{x=Math.min(Math.max((x-a)/(b-a),0),1);return x*x*(3-2*x)};
const captions=['Your journey begins…','The gateway awakens','Enter the intelligence','Three worlds await'];
function placeAtEnd(){P.x=0;P.z=END_Z;P.yaw=P.yawT=0;P.pitch=P.pitchT=.03}
function endCinematic(){cinematic=false;camera.fov=60;camera.updateProjectionMatrix();placeAtEnd();awakeTarget=1;$('cinema').textContent='▶ Cinematic';$('caption').textContent='Walk toward a portal · Drag to look around'}
function setCinematic(){cinematic=true;cinemaT=0;$('cinema').textContent='Skip Intro';$('caption').textContent=captions[0]}
function begin(mode){chosen=true;$('welcome').hidden=true;$('controls').hidden=false;if(mode==='explore'){P.x=0;P.z=START_Z;P.yaw=P.yawT=0;P.pitch=P.pitchT=.04;awakeTarget=1;$('caption').textContent='Walk through the gateway · Drag to look around'}else setCinematic()}
document.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',()=>begin(b.dataset.start)));
$('cinema').addEventListener('click',()=>{if(!chosen)return;if(cinematic)endCinematic();else{awake=.35;setCinematic()}});
$('reset').addEventListener('click',()=>{chosen=false;cinematic=false;camera.fov=60;camera.updateProjectionMatrix();awakeTarget=.35;$('welcome').hidden=false;$('controls').hidden=true;$('status').textContent='';$('enter').style.display='none';$('cinema').textContent='▶ Cinematic';$('caption').textContent='Three worlds. One intelligence. Your next chapter.'});
$('enter').addEventListener('click',()=>{if(selected){$('status').textContent=selected.name+' — prototype destination';$('caption').textContent='In the full website, this opens '+selected.name+'.'}});
// Joystick (move) and swipe (look).
const stick=$('stick'),knob=$('knob');let activePointer=null;
function moveStick(e){let r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),dd=Math.hypot(x,y),max=35;if(dd>max){x*=max/dd;y*=max/dd}knob.style.transform=`translate(${x}px,${y}px)`;walk.x=x/max;walk.y=-y/max}
stick.addEventListener('pointerdown',e=>{activePointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===activePointer)moveStick(e)});
function stop(e){if(e.pointerId===activePointer){activePointer=null;walk.x=walk.y=0;knob.style.transform=''}}
stick.addEventListener('pointerup',stop);stick.addEventListener('pointercancel',stop);
let drag=null;const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId||cinematic||!chosen)return;P.yawT-=(e.clientX-drag.x)*.0045;P.pitchT=THREE.MathUtils.clamp(P.pitchT-(e.clientY-drag.y)*.0035,-.55,.6);drag.x=e.clientX;drag.y=e.clientY});
const endDrag=e=>{if(drag&&drag.id===e.pointerId)drag=null};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);pointScale()}addEventListener('resize',resize);

function frame(){requestAnimationFrame(frame);let dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 stars.rotation.y=t*.004;brain.rotation.y=Math.sin(t*.2)*.12;
 for(let i=0;i<gateMeshes.length;i++){let o=gateMeshes[i];o.inside.material.opacity=.19+Math.sin(t*1.7+i)*.055;o.bright.material.opacity=.65+Math.sin(t*2+i)*.3}
 // Gateway animation.
 for(const r of rings)r.g.rotation.z+=r.w*dt*motionScale;
 core.rotation.y+=dt*.12*motionScale;core.rotation.x=Math.sin(t*.3)*.15*motionScale;
 gateU.uT.value=t*motionScale;
 if(cinematic){cinemaT+=dt;const T=cinemaT;
  awake=reduceMotion?.35+.65*smooth(0,2.5,T):.35+.65*smooth(2,4,T);
  if(reduceMotion){placeAtEnd()}else{P.z=track(KZ,T);P.x=0;P.yaw=P.yawT=0;P.pitch=P.pitchT=track(KP,T);camera.fov=60+4*Math.sin(smooth(4,6.5,T)*Math.PI);camera.updateProjectionMatrix()}
  $('caption').textContent=captions[Math.min(3,Math.floor((reduceMotion?T*1.4:T)/2))];
  if(T>=(reduceMotion?3:INTRO))endCinematic();
 }else awake+=(awakeTarget-awake)*Math.min(1,dt*2.5);
 gateU.uA.value=awake;const sweep=(awake-.35)/.65;
 for(const gl of gateGlows)gl.m.opacity=gl.base*(.35+.65*Math.min(Math.max(sweep*1.5-gl.delay,0),1));
 const coreLvl=Math.min(Math.max(sweep*1.5-.5,0),1);coreMat.emissiveIntensity=.08+.5*coreLvl*(.9+.1*Math.sin(t*2.2));core.scale.setScalar(1+.04*Math.sin(t*1.6)*coreLvl*motionScale);gateLight.intensity=.25+.75*coreLvl;
 if(chosen){
  let bob=0;
  if(!cinematic){
   let mx=walk.x+(keys.d?1:0)-(keys.a?1:0),my=walk.y+(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
   P.yawT+=((keys.arrowleft?1:0)-(keys.arrowright?1:0))*dt*1.6;
   const sp=dt*7,fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
   const nx=THREE.MathUtils.clamp(P.x+(fx*my+rx*mx)*sp,-30,30),nz=THREE.MathUtils.clamp(P.z+(fz*my+rz*mx)*sp,-58,38);
   if(!blocked(nx,nz)){P.x=nx;P.z=nz}else if(!blocked(nx,P.z))P.x=nx;else if(!blocked(P.x,nz))P.z=nz;
   const mag=Math.min(1,Math.hypot(mx,my));if(mag>.08&&!reduceMotion){P.phase+=dt*9*mag;bob=Math.sin(P.phase)*.035*mag}
   const k=Math.min(1,dt*12);P.yaw+=(P.yawT-P.yaw)*k;P.pitch+=(P.pitchT-P.pitch)*k;
  }
  camera.position.set(P.x,(cinematic&&!reduceMotion?track(KY,cinemaT):EYE)+bob,P.z);camera.rotation.set(P.pitch,P.yaw,0);
  let best=null,bestDist=9;for(let p of portals){let d=Math.hypot(P.x-p.x,P.z+43);if(d<bestDist){best=p;bestDist=d}}
  selected=best;$('enter').style.display=best&&!cinematic?'block':'none';$('status').textContent=best&&!cinematic?'✦ '+best.name:'';
 }else{camera.position.set(Math.sin(t*.1)*2*motionScale,7.5,62);camera.lookAt(0,5.5,0)}
 renderer.render(scene,camera)}
$('loading').hidden=true;frame();})();
