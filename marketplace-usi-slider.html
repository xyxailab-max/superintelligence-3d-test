// The eight live Marketplace products, copied from production (src/index.js HOUSE list, served by /api/listings).
const SITE='https://usesuperintelligence.com';
const HOUSE_GETS=["Free, no sign-up","Runs on open-source AI","Chat right in your browser"];
let products=[
 ["guide","Agent","Brain Guide","Explains the science, history and ideas behind everything in the 3D brain, for any age."],
 ["coach","Agent","AI Coach","Practical ways to use AI in your job or business this week, with simple steps."],
 ["resume","Agent","Resume Helper","Improves your resume with strong action verbs and writes tailored cover letters."],
 ["business","Agent","Business Idea Lab","Brainstorms business ideas and honestly checks the customer, competition and first step."],
 ["tutor","Agent","Study Tutor","Explains any school topic step by step and checks you understood."],
 ["social","Agent","Social Post Writer","Writes catchy posts, captions and short video ideas with fitting hashtags."],
 ["email","Agent","Email Writer","Drafts clear, polite, ready-to-send emails for any situation."],
 ["quiz","Agent","Quiz Master","Runs a multiple-choice quiz on any topic and keeps your score."]
].map(([a,type,title,desc])=>({id:'house'+a,type,title,desc,price:0,creator:'Use Superintelligence',url:SITE+'/agents/'+a,house:true,featured:false,image:'marketplace/astral-v2/'+title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.webp',gets:HOUSE_GETS}));
products.push({id:'houseprompts-work',type:'Prompt pack',title:'AI at Work Prompt Pack',desc:'25 copy-ready prompts for email, meetings, planning, research and customers. Works with any AI chat.',price:0,creator:'Use Superintelligence',url:'https://xyxailab-max.github.io/superintelligence-3d-test/prompts/ai-at-work.html',house:true,featured:false,image:'marketplace/categories/prompts-templates.webp?v=15',gets:['Free, no sign-up','25 prompts in 5 groups','One-tap copy']});
products.push({id:'housecourse-work',type:'Course',title:'AI at Work in 5 Lessons',desc:'A free beginner mini-course: 5 short lessons, each with a 5-minute practice task. About 30 minutes total.',price:0,creator:'Use Superintelligence',url:'https://xyxailab-max.github.io/superintelligence-3d-test/courses/ai-at-work.html',house:true,featured:false,image:'marketplace/categories/courses.webp?v=15',gets:['Free, no sign-up','5 lessons, about 30 minutes','Practice task in every lesson']});
const TYPES=["All","Featured","Free","Agent","Course","Prompt pack","Template","Automation","Tool"];
const grid=document.getElementById('grid'),dock=document.getElementById('dock'),filter=document.getElementById('filter'),search=document.getElementById('search'),detail=document.getElementById('detail');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const money=n=>n?'$'+n:'Free';
const inCat=(p,c)=>c==='All'||(c==='Free'?!p.price:c==='Featured'?!!p.featured:p.type===c);
function cats(){return TYPES.filter(t=>t==='All'||products.some(p=>inCat(p,t)))}
function art(p){return p.image?`<div class="pic"><img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy"></div>`:`<div class="art" aria-hidden="true">✧</div>`}
function setFilters(){const cur=filter.value||'All';filter.innerHTML=cats().map(c=>`<option value="${esc(c)}">${esc(c==='All'?'All Categories':c)}</option>`).join('');filter.value=cats().includes(cur)?cur:'All'}
function render(){const words=search.value.toLowerCase().split(/\s+/).filter(Boolean),cat=filter.value;const matches=products.filter(p=>inCat(p,cat)&&words.every(w=>[p.title,p.desc,p.type,p.creator].join(' ').toLowerCase().includes(w)));grid.innerHTML=matches.length?matches.map(p=>{const i=products.indexOf(p);return `<button class="product" data-i="${i}" aria-label="View ${esc(p.title)}">${art(p)}<div class="info"><div class="cat">${esc(p.type)}${p.featured?' · Featured':''}</div><h2>${esc(p.title)}</h2><div class="desc">${esc(p.desc)}</div><div class="foot"><span>${esc(p.creator)}</span><span class="price">${esc(money(p.price))}</span></div></div></button>`}).join(''):'<div class="empty">Nothing matches yet. Try another word or category.</div>';dock.innerHTML=cats().map(c=>`<button class="${cat===c?'active':''}" data-cat="${esc(c)}">${esc(c==='All'?'All Categories':c)}</button>`).join('')}
function action(p){const safe=/^https:\/\//.test(p.url);if(!safe)return '';if(p.house||!p.price)return `<a class="go" href="${esc(p.url)}">Try ${esc(p.title)} free →</a>`;return `<a class="go" href="${esc(p.url)}" target="_blank" rel="noopener sponsored">Buy for ${esc(money(p.price))} on ${esc(p.creator)}'s site →</a>`}
grid.addEventListener('click',e=>{const card=e.target.closest('[data-i]');if(!card)return;const p=products[Number(card.dataset.i)];document.getElementById('detailContent').innerHTML=`${art(p)}<div class="body"><div class="cat">${esc(p.type)}</div><h2>${esc(p.title)}</h2><p>${esc(p.desc)}</p>${p.gets&&p.gets.length?`<p>${p.gets.map(esc).join(' · ')}</p>`:''}<div class="foot"><span>Created by ${esc(p.creator)}</span><span class="price">${esc(money(p.price))}</span></div>${action(p)}</div>`;detail.showModal()});
dock.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b){filter.value=b.dataset.cat;render();grid.scrollIntoView({behavior:'smooth',block:'start'})}});
search.addEventListener('input',render);filter.addEventListener('change',render);document.getElementById('close').addEventListener('click',()=>detail.close());detail.addEventListener('click',e=>{if(e.target===detail)detail.close()});
setFilters();render();
// Same as production: if this page is served with the live API, approved listings replace the list above.
const ART=['brain-guide','ai-coach','resume-helper','business-idea-lab','study-tutor','social-post-writer','email-writer','quiz-master'],slug=t=>String(t).toLowerCase().replace(/[^a-z0-9]+/g,'-');fetch('/api/listings',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{const items=d&&Array.isArray(d.items)?d.items:[];const ps=items.filter(x=>x&&x.id&&x.title&&/^https:\/\//.test(x.url||'')).map(x=>({id:x.id,type:x.type,title:x.title,desc:x.desc||'',price:Number(x.price)||0,creator:x.creator||'Creator',url:x.url,house:!!x.house,featured:!!x.featured,image:x.image||(ART.includes(slug(x.title))?'marketplace/astral-v2/'+slug(x.title)+'.webp':''),gets:x.house?HOUSE_GETS:[]}));if(!ps.length)return;ps.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0));products=ps;setFilters();render()}).catch(()=>{});

<script>
(()=>{const g=document.getElementById('grid');if(!g)return;
// Background image layer (never receives touches)
const bg=document.createElement('div');bg.className='bgimg';bg.setAttribute('aria-hidden','true');document.body.prepend(bg);

const CAT_ICONS={'All':'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
'Featured':'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z',
'Agent':'M12 5a3 3 0 0 0-5.8.9A3 3 0 0 0 4 10a3 3 0 0 0 .9 3.6A3 3 0 0 0 7.5 19 3 3 0 0 0 12 19.5zM12 5a3 3 0 0 1 5.8.9A3 3 0 0 1 20 10a3 3 0 0 1-.9 3.6A3 3 0 0 1 16.5 19 3 3 0 0 1 12 19.5zM8 10.5c1 0 2 .6 2 1.8M16 10.5c-1 0-2 .6-2 1.8',
'Course':'M3 5.5c2.5-1 5.5-1 9 1.2v13c-3.5-2.2-6.5-2.2-9-1.2zM21 5.5c-2.5-1-5.5-1-9 1.2v13c3.5-2.2 6.5-2.2 9-1.2z',
'Prompt pack':'M4 5h16v11H10l-5 4v-4H4z',
'Template':'M12 3l9 4.5-9 4.5-9-4.5zM3 12l9 4.5 9-4.5M3 16.5l9 4.5 9-4.5',
'Automation':'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2.5v3M12 18.5v3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M2.5 12h3M18.5 12h3M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1',
'Tool':'M15 4a5 5 0 0 0-4.8 6.4L3.5 17.1a2.1 2.1 0 0 0 3 3l6.7-6.7A5 5 0 0 0 20 9l-3 3-3-1-1-3z'};
const CAT_NAMES={'All':'All','Featured':'Featured','Agent':'Agents','Course':'Courses','Prompt pack':'Prompts','Template':'Templates','Automation':'Automations','Tool':'Tools'};
const still=matchMedia('(prefers-reduced-motion: reduce)');
const cards=()=>[...g.querySelectorAll('.product')];
let cs=[],n=0,cw=280,pos=0,target=0,vel=0,raf=0,last=0,drag=null,justDragged=false;
const loop=()=>n>2;
const wrap=x=>loop()?((x%n)+n*1.5)%n-n/2:x;

function lay(){if(!n)return;const W=g.clientWidth,Rx=Math.max(cw*1.25,Math.min(W*.47,cw*2.3)),Rz=cw*1.2,edge=loop()?Math.min(W<620?1.98:3.7,n/2):1.6;let best=-1,bd=9;
cs.forEach((c,i)=>{const off=wrap(i-pos),a=Math.abs(off),t=off*.5,op=Math.max(0,1-Math.pow(a/edge,2.4)),s=Math.max(.5,1-Math.min(a,3.5)*.14);
c.style.transform=`translate(-50%,-50%) translate3d(${(Math.sin(t)*Rx).toFixed(1)}px,0,${((Math.cos(t)-1)*Rz).toFixed(1)}px) rotateY(${(t*.72*57.2958).toFixed(2)}deg) scale(${s.toFixed(3)})`;
c.style.opacity=op.toFixed(3);c.style.zIndex=String(100-Math.round(a*10));c.style.pointerEvents=op<.08?'none':'';c.tabIndex=a<.5?0:-1;if(a<bd){bd=a;best=i}});

const k=1-Math.pow(.86,dt/16.7);pos+=(target-pos)*k;if(Math.abs(target-pos)<.0008){pos=target;if(loop()){pos=target=mod(target)}lay();last=0;return}lay();raf=requestAnimationFrame(tick)}
const run=()=>{if(still.matches&&!drag){pos=target;lay();return}if(!raf)raf=requestAnimationFrame(tick)};
const clampT=x=>loop()?x:Math.max(0,Math.min(n-1,x));

const step=d=>{if(!n)return;target=clampT(Math.round(target)+d);run()};
g.addEventListener('pointerdown',e=>{if(!n||(e.pointerType==='mouse'&&e.button!==0))return;drag={id:e.pointerId,x:e.clientX,p:pos,lx:e.clientX,lt:e.timeStamp,moved:false};vel=0;target=pos});
addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x;if(!drag.moved&&Math.abs(dx)>6){drag.moved=true;g.classList.add('dragging')}if(!drag.moved)return;
const unit=cw*.8,dt=Math.max(1,e.timeStamp-drag.lt),v=-(e.clientX-drag.lx)/unit/dt;vel=vel*.6+v*.4;drag.lx=e.clientX;drag.lt=e.timeStamp;let p=drag.p-dx/unit;if(!loop())p=Math.max(-.35,Math.min(n-.65,p));pos=p;if(!raf)raf=requestAnimationFrame(tick)},{passive:true});

g.addEventListener('click',e=>{if(justDragged){e.preventDefault();e.stopImmediatePropagation();return}const c=e.target.closest('.product');if(!c)return;e.preventDefault();e.stopImmediatePropagation();if(!c.classList.contains('on')){go(cs.indexOf(c));return}const p=products[Number(c.dataset.i)];if(!p||!/^https:\/\//.test(p.url))return;if(p.house||!p.price)location.href=p.url;else window.open(p.url,'_blank','noopener')},true);
addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.target===search)return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
// Find where the image's gold platform lands on screen (image 1536x1024, platform top ~y700, cover + 50% 70%) and seat the cards on it
const fit=()=>{document.body.style.height=innerHeight+'px';const W=innerWidth,H=innerHeight,port=H>=W,sc=port?Math.max(W/1024,H/1536):Math.max(W/1536,H/1024),oy=port?(H-1536*sc)*.5:(H-1024*sc)*.7,plat=oy+(port?1088:715)*sc,gr=g.getBoundingClientRect(),c=g.querySelector('.product .info'),ih=c?c.offsetHeight:140,base=Math.min(gr.height-6,plat-gr.top),room=base-12;
cw=Math.max(150,Math.min(330,W*.5,(room-ih)*360/464));const ch=cw*464/360+ih;g.style.setProperty('--cw',cw+'px');const hd=document.querySelector('header'),sn=document.querySelector('.slidenav');let cy=Math.max(ch/2+6,base-ch/2-4);if(hd&&sn){const hb=hd.getBoundingClientRect().bottom,nt=sn.getBoundingClientRect().top;if(ch<=nt-hb)cy=(hb+nt)/2-gr.top}g.style.setProperty('--cy',cy+'px');lay()};
const refresh=()=>{cs=cards();n=cs.length;cs.forEach((c,i)=>c.style.setProperty('--k',i));pos=target=0;vel=0;const cur=filter.value||'All';dots.innerHTML=cats().filter(c=>CAT_ICONS[c]).map(c=>`<button class="ic${c===cur?' on':''}" type="button" data-cat="${esc(c)}" aria-label="Show ${esc(CAT_NAMES[c])}" aria-pressed="${c===cur}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${CAT_ICONS[c]}"/></svg><span>${esc(CAT_NAMES[c])}</span></button>`).join('');requestAnimationFrame(fit)};

</script>

 linear-gradient(0deg,#0E1220 0,transparent 30%)!important}

<script>
/* Swaps the bottom bar's icons for the six USI categories. Taps on a category that has products use the slider's
   existing .ic handler (sets the existing filter + render); no carousel code is changed. */
(()=>{const dots=document.querySelector('.slidenav .dots');if(!dots)return;
const C=[['AI Agents','AI Agents','ai-agents',['Agent']],['AI Tools & Automation','AI Tools','ai-tools-automation',['Automation','Tool']],
 ['Prompts & Templates','Prompts','prompts-templates',['Prompt pack','Template']],['Digital Art & Creative Assets','Digital Art','digital-art-creative-assets',[]],
 ['Courses','Courses','courses',['Course']],['Software','Software','software',[]]];
function build(){const cur=filter.value||'All',opts=[...filter.options].map(o=>o.value);
 dots.innerHTML=C.map(([full,short,file,types])=>{const t=types.find(x=>opts.includes(x)&&products.some(p=>p.type===x)),on=types.includes(cur),
  img=`<img class="usi-im" src="marketplace/categories/${file}.webp?v=15" width="720" height="960" alt="" draggable="false">`;
  return t?`<button class="ic${on?' on':''}" type="button" data-cat="${esc(on?cur:t)}" aria-label="${esc('Show '+full)}" aria-pressed="${on}">${img}<span>${esc(short)}</span></button>`
   :`<span class="usi-off" role="img" aria-label="${esc(full)}, coming soon">${img}<span>${esc(short)}</span></span>`}).join('');
 dispatchEvent(new Event('resize'))}
new MutationObserver(()=>{if(!dots.querySelector('.usi-im'))build()}).observe(dots,{childList:true});
/* One category at a time: never show a mixed list. Start on AI Agents; keep any mixed choice (All, Free, Featured) out. */
const own=t=>C.some(c=>c[3].includes(t));
const keep=()=>{if(!own(filter.value)){const o=[...filter.options].map(x=>x.value);filter.value=o.includes('Agent')?'Agent':(C.flatMap(c=>c[3]).find(t=>o.includes(t))||filter.value);render()}};
filter.addEventListener('change',keep);new MutationObserver(()=>{if(!own(filter.value))keep()}).observe(filter,{childList:true});
