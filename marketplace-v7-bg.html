function lay(){if(!n)return;const W=g.clientWidth,Rx=Math.max(cw*1.25,Math.min(W*.47,cw*2.3)),Rz=cw*1.2,edge=loop()?Math.min(3.7,n/2):1.6;let best=-1,bd=9;
cs.forEach((c,i)=>{const off=wrap(i-pos),a=Math.abs(off),t=off*.5,op=Math.max(0,1-Math.pow(a/edge,2.4)),s=Math.max(.5,1-Math.min(a,3.5)*.14);
c.style.transform=`translate(-50%,-50%) translate3d(${(Math.sin(t)*Rx).toFixed(1)}px,0,${((Math.cos(t)-1)*Rz).toFixed(1)}px) rotateY(${(t*.72*57.2958).toFixed(2)}deg) scale(${s.toFixed(3)})`;
c.style.opacity=op.toFixed(3);c.style.zIndex=String(100-Math.round(a*10));c.style.pointerEvents=op<.08?'none':'';c.tabIndex=a<.5?0:-1;if(a<bd){bd=a;best=i}});
cs.forEach((c,i)=>c.classList.toggle('on',i===best));const k=mod(pos);[...dots.children].forEach((d,i)=>d.classList.toggle('on',i===k))}
function tick(t){raf=0;const dt=Math.min(64,last?t-last:16.7);last=t;if(drag)return lay();
const k=1-Math.pow(.86,dt/16.7);pos+=(target-pos)*k;if(Math.abs(target-pos)<.0008){pos=target;if(loop()){pos=target=mod(target)}lay();last=0;return}lay();raf=requestAnimationFrame(tick)}
const run=()=>{if(still.matches&&!drag){pos=target;lay();return}if(!raf)raf=requestAnimationFrame(tick)};
const clampT=x=>loop()?x:Math.max(0,Math.min(n-1,x));
const go=i=>{if(!n)return;const r=Math.round(target);target=clampT(r+Math.round(wrap(i-r)));run()};
const step=d=>{if(!n)return;target=clampT(Math.round(target)+d);run()};
g.addEventListener('pointerdown',e=>{if(!n||(e.pointerType==='mouse'&&e.button!==0))return;drag={id:e.pointerId,x:e.clientX,p:pos,lx:e.clientX,lt:e.timeStamp,moved:false};vel=0;target=pos});
addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x;if(!drag.moved&&Math.abs(dx)>6){drag.moved=true;g.classList.add('dragging')}if(!drag.moved)return;
const unit=cw*.8,dt=Math.max(1,e.timeStamp-drag.lt),v=-(e.clientX-drag.lx)/unit/dt;vel=vel*.6+v*.4;drag.lx=e.clientX;drag.lt=e.timeStamp;let p=drag.p-dx/unit;if(!loop())p=Math.max(-.35,Math.min(n-.65,p));pos=p;if(!raf)raf=requestAnimationFrame(tick)},{passive:true});
const end=e=>{if(!drag||e.pointerId!==drag.id)return;const m=drag.moved;drag=null;g.classList.remove('dragging');if(m){justDragged=true;setTimeout(()=>justDragged=false,0);target=clampT(Math.round(pos+Math.max(-2.5,Math.min(2.5,vel*260))));run()}};
addEventListener('pointerup',end);addEventListener('pointercancel',end);
g.addEventListener('dragstart',e=>e.preventDefault());
nav.addEventListener('click',e=>{const b=e.target.closest('.arr');if(b)step(Number(b.dataset.d))});
g.addEventListener('click',e=>{if(justDragged){e.preventDefault();e.stopImmediatePropagation();return}const c=e.target.closest('.product');if(!c)return;e.preventDefault();e.stopImmediatePropagation();if(!c.classList.contains('on')){go(cs.indexOf(c));return}const p=products[Number(c.dataset.i)];if(!p||!/^https:\/\//.test(p.url))return;if(p.house||!p.price)location.href=p.url;else window.open(p.url,'_blank','noopener')},true);
addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.target===search)return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
// Find where the image's gold platform lands on screen (image 1536x1024, platform top ~y700, cover + 50% 70%) and seat the cards on it
const fit=()=>{const W=innerWidth,H=innerHeight,port=H>=W,sc=port?Math.max(W/1086,H/1448):Math.max(W/1536,H/1024),oy=port?(H-1448*sc)*.5:(H-1024*sc)*.7,plat=oy+(port?1022:712)*sc,gr=g.getBoundingClientRect(),c=g.querySelector('.product .info'),ih=c?c.offsetHeight:140,base=Math.min(gr.height-6,plat-gr.top),room=base-12;
cw=Math.max(150,Math.min(330,W*.5,(room-ih)*360/464));const ch=cw*464/360+ih;g.style.setProperty('--cw',cw+'px');g.style.setProperty('--cy',Math.max(ch/2+6,base-ch/2-4)+'px');lay()};
const refresh=()=>{cs=cards();n=cs.length;cs.forEach((c,i)=>c.style.setProperty('--k',i));pos=target=0;vel=0;dots.innerHTML=cs.map(()=>'<i></i>').join('');requestAnimationFrame(fit)};
new MutationObserver(refresh).observe(g,{childList:true});addEventListener('resize',()=>requestAnimationFrame(fit));refresh()})();
</script>
</body></html>
