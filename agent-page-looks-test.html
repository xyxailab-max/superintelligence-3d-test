<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Agent Page Looks | Use Superintelligence</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --sans:"Manrope","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { background:#05060c; color:#E9EDFF; font:400 1rem/1.5 var(--sans); -webkit-text-size-adjust:100%; }
  button { font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .sw { position:sticky; top:0; z-index:50; display:flex; flex-wrap:wrap; justify-content:center; gap:6px; padding:10px 12px; background:#05070fe6; border-bottom:1px solid #1a2238; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .sw button { padding:8px 14px; font:700 .8rem/1 var(--sans); border:1px solid #2a3550; border-radius:999px; background:#0E1220; color:#9AA3B8; }
  .sw button[aria-pressed="true"] { color:#06101f; background:#5aa2ff; border-color:#5aa2ff; }
  .look { display:none; min-height:calc(100vh - 50px); } .look.on { display:block; }
  .in { max-width:860px; margin:0 auto; padding:14px 16px 40px; position:relative; z-index:1; }
  .back { display:inline-block; padding:8px 12px; border-radius:999px; text-decoration:none; font:600 .8rem/1 var(--sans); border:1px solid currentColor; opacity:.7; color:inherit; }
  .head { text-align:center; margin:10px 0 0; }
  .head .k { font:600 .68rem/1 var(--mono); letter-spacing:.16em; text-transform:uppercase; }
  .head h1 { margin:6px 0 4px; font:800 clamp(1.9rem,6vw,2.8rem)/1.05 var(--sans); letter-spacing:-.02em; }
  .head p { margin:0 auto; max-width:460px; opacity:.7; }
  .info { max-width:540px; min-height:58px; margin:12px auto 18px; display:flex; align-items:center; justify-content:center; gap:12px; padding:12px 16px; border-radius:18px; text-align:left; transition:background .3s, border-color .3s; border:1px solid transparent; }
  .info p { margin:0; flex:1; font:500 .88rem/1.35 var(--sans); } .info p span { opacity:.7; }
  .info a { flex:none; padding:10px 16px; border-radius:999px; font:800 .8rem/1 var(--sans); text-decoration:none; }
  .info .tip { font:600 .66rem/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; opacity:.5; }
  .chat { border-radius:22px; padding:16px; }
  .log { display:flex; flex-direction:column; gap:10px; height:min(40vh,340px); overflow-y:auto; }
  .hint { margin:auto; text-align:center; opacity:.6; font-size:.92rem; }
  .msg { max-width:88%; padding:11px 14px; border-radius:16px; white-space:pre-wrap; animation:mIn .3s ease-out; }
  @keyframes mIn { from { opacity:0; transform:translateY(6px); } }
  .msg.you { align-self:flex-end; border-bottom-right-radius:4px; } .msg.bot { align-self:flex-start; border-bottom-left-radius:4px; }
  .starters { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:10px 0; }
  .starters button { padding:9px 14px; font:600 .84rem/1.2 var(--sans); border-radius:999px; background:transparent; transition:transform .2s; }
  .starters button:hover { transform:translateY(-2px); }
  .ask { display:flex; gap:8px; }
  .ask input { flex:1; min-width:0; padding:13px 16px; font:500 1rem/1.2 var(--sans); border-radius:999px; color:inherit; }
  .ask input:focus { outline:none; }
  .ask button { padding:0 20px; font:800 .85rem/1 var(--sans); border:0; border-radius:999px; }
  svg.i { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }

  /* ========== 1 · SPACE STATION ========== */
  #L1 { position:relative; overflow:hidden; background:radial-gradient(1200px 600px at 50% 0%, #101a3a, #04050b 70%); color:#E9EDFF; }
  #starsBg { position:absolute; inset:0; width:100%; height:100%; z-index:0; }
  .orbit { position:relative; height:340px; margin:4px auto 0; max-width:700px; }
  .orbit .path { position:absolute; left:50%; top:50%; width:84%; height:52%; transform:translate(-50%,-50%); border-radius:50%; border:1px solid #5aa2ff26; }
  .orbit .core { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:76px; z-index:50; animation:float 6s ease-in-out infinite; filter:drop-shadow(0 0 14px #5aa2ff88); }
  @keyframes float { 50% { translate:0 -6px; } }
  .planet { position:absolute; left:0; top:0; display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:0; padding:0; will-change:transform; }
  .planet .ball { width:58px; height:58px; display:grid; place-items:center; border-radius:50%; color:#fff;
    background:radial-gradient(circle at 32% 28%, #ffffffcc, var(--p) 38%, color-mix(in srgb, var(--p) 40%, #000) 80%);
    box-shadow:0 0 24px color-mix(in srgb, var(--p) 55%, transparent), inset -8px -10px 18px #00000077; }
  .planet .ball svg.i { width:24px; height:24px; stroke:#fff; }
  .planet .name { font:700 .72rem/1.1 var(--sans); white-space:nowrap; text-shadow:0 2px 8px #000; }
  .planet.on .ball { box-shadow:0 0 0 2px #fff, 0 0 40px var(--p), inset -8px -10px 18px #00000077; }
  #L1 .info.on { background:#0c1430cc; border-color:#5aa2ff55; } #L1 .info a { background:#5aa2ff; color:#06101f; }
  #L1 .chat { background:#0a1024cc; border:1px solid #5aa2ff33; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  #L1 .msg.you { background:#16213a; border:1px solid #2F6BFF66; } #L1 .msg.bot { background:#0f1a36; border:1px solid #5aa2ff33; }
  #L1 .starters button { border:1px solid #5aa2ff44; } #L1 .ask input { background:#ffffff0d; border:1px solid #ffffff26; } #L1 .ask button { background:#5aa2ff; color:#06101f; }
  #L1 .head .k { color:#7fc4ff; }

  /* ========== 2 · GLASS LAB (light) ========== */
  #L2 { color:#1b2233; background:radial-gradient(900px 500px at 20% 0%, #ffffff, transparent 60%), radial-gradient(800px 500px at 100% 30%, #dfe8ff, transparent 60%), linear-gradient(180deg,#eef2f8,#e4e9f2); }
  #L2 .head .k { color:#4a6cf7; }
  .disc { width:120px; height:120px; margin:6px auto 0; display:grid; place-items:center; border-radius:50%; background:linear-gradient(145deg,#ffffffd9,#ffffff66); border:1px solid #ffffff;
    box-shadow:0 20px 40px -18px #4a5b8a66, inset 0 2px 0 #fff; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  .disc img { width:78px; animation:float 6s ease-in-out infinite; }
  .bubbles { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; max-width:560px; margin:22px auto 0; }
  .bub { display:flex; flex-direction:column; align-items:center; gap:8px; padding:0; border:0; background:none; color:#1b2233; }
  .bub .gl { width:86px; height:86px; display:grid; place-items:center; border-radius:50%; color:var(--p);
    background:radial-gradient(circle at 30% 25%, #ffffff, #ffffffb3 40%, color-mix(in srgb, var(--p) 18%, #ffffff80) 100%);
    border:1px solid #ffffff; box-shadow:0 18px 30px -16px color-mix(in srgb, var(--p) 60%, #4a5b8a), inset 0 -6px 14px color-mix(in srgb, var(--p) 15%, transparent), inset 0 3px 0 #fff;
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); transition:transform .3s; }
  .bub .gl svg.i { width:30px; height:30px; }
  .bub b { font:700 .82rem/1.2 var(--sans); text-align:center; }
  .bub:hover .gl { transform:translateY(-4px); }
  .bub.wob .gl { animation:wobble .7s cubic-bezier(.3,1.6,.5,1); }
  @keyframes wobble { 0% { transform:scale(1); } 25% { transform:scale(1.15,.88); } 50% { transform:scale(.92,1.1); } 75% { transform:scale(1.05,.97); } 100% { transform:scale(1); } }
  .bub.on .gl { box-shadow:0 0 0 3px var(--p), 0 18px 34px -14px var(--p), inset 0 3px 0 #fff; }
  #L2 .info.on { background:#ffffffb3; border-color:#ffffff; box-shadow:0 12px 30px -18px #4a5b8a88; } #L2 .info a { background:#1b2233; color:#fff; }
  #L2 .chat { background:#ffffffa6; border:1px solid #ffffff; box-shadow:0 24px 50px -28px #4a5b8a88; -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
  #L2 .msg.you { background:#1b2233; color:#fff; } #L2 .msg.bot { background:#ffffff; border:1px solid #e3e8f2; }
  #L2 .starters button { border:1px solid #cfd8ea; background:#ffffff99; } #L2 .ask input { background:#ffffff; border:1px solid #d7deeb; } #L2 .ask button { background:#4a6cf7; color:#fff; }

  /* ========== 3 · CITY AT NIGHT ========== */
  #L3 { position:relative; overflow:hidden; color:#E9EDFF; background:linear-gradient(180deg,#0b0f2a 0%,#1a1440 45%,#2a1638 70%,#07060f 100%); }
  .moon { position:absolute; right:12%; top:70px; width:70px; height:70px; border-radius:50%; background:radial-gradient(circle at 40% 35%, #fff, #d9dcf5 60%, #b9bde6); box-shadow:0 0 60px #c9ccff66; }
  #L3 .head .k { color:#ffb86b; }
  .city { position:relative; display:flex; align-items:flex-end; justify-content:center; gap:6px; height:300px; margin:14px auto 0; max-width:720px; padding:0 4px; }
  .city::after { content:""; position:absolute; left:-20px; right:-20px; bottom:-1px; height:16px; background:linear-gradient(180deg,#07060f,#000); }
  .bld { position:relative; flex:1; max-width:96px; display:flex; flex-direction:column; justify-content:flex-start; align-items:center; padding:0; border:0; color:#E9EDFF;
    background:linear-gradient(180deg,#1c2142,#10132a); border-radius:6px 6px 0 0; box-shadow:inset 1px 0 0 #ffffff10, inset -1px 0 0 #00000060; transition:filter .3s, box-shadow .3s; }
  .bld .win { position:absolute; inset:34px 10px 34px; background:repeating-linear-gradient(180deg, transparent 0 8px, #0000 8px 9px), repeating-linear-gradient(90deg, #ffd27a1f 0 7px, transparent 7px 12px), repeating-linear-gradient(180deg, #ffd27a1f 0 6px, transparent 6px 12px); opacity:.6; transition:opacity .4s; }
  .bld .top { position:relative; z-index:2; margin-top:-18px; width:36px; height:36px; display:grid; place-items:center; border-radius:50%; background:#141834; border:1px solid var(--p); color:var(--p); box-shadow:0 0 14px color-mix(in srgb, var(--p) 40%, transparent); }
  .bld .top svg.i { width:18px; height:18px; }
  .bld .lbl { position:absolute; bottom:22px; left:0; right:0; z-index:2; font:700 .62rem/1.15 var(--sans); text-align:center; padding:0 4px; }
  .bld.on { box-shadow:0 0 30px color-mix(in srgb, var(--p) 45%, transparent), inset 0 0 0 1px var(--p); }
  .bld.on .win { opacity:1; background:repeating-linear-gradient(90deg, color-mix(in srgb, var(--p) 80%, #fff) 0 7px, transparent 7px 12px), repeating-linear-gradient(180deg, transparent 0 6px, #10132a 6px 12px); animation:flick 1.6s steps(2) infinite; }
  @keyframes flick { 50% { opacity:.85; } }
  .tower { flex:1.3; max-width:120px; background:linear-gradient(180deg,#232a55,#121633); border-radius:10px 10px 0 0; position:relative; display:flex; justify-content:center; }
  .tower img { position:absolute; top:-64px; width:70px; filter:drop-shadow(0 0 14px #5aa2ffaa); animation:float 6s ease-in-out infinite; }
  .tower::before { content:""; position:absolute; inset:20px 14px 30px; background:repeating-linear-gradient(90deg, #5aa2ff55 0 6px, transparent 6px 11px), repeating-linear-gradient(180deg, transparent 0 6px, #121633 6px 12px); }
  #L3 .info.on { background:#1a1638cc; border-color:#ffb86b66; } #L3 .info a { background:#ffb86b; color:#1a0d05; }
  #L3 .chat { background:#0d0b1fd9; border:1px solid #ffffff1f; }
  #L3 .msg.you { background:#2a1f4a; border:1px solid #6b5bd666; } #L3 .msg.bot { background:#16132d; border:1px solid #ffb86b33; }
  #L3 .starters button { border:1px solid #ffb86b55; } #L3 .ask input { background:#ffffff0d; border:1px solid #ffffff26; } #L3 .ask button { background:#ffb86b; color:#1a0d05; }
  @media (max-width:560px) { .bld .lbl { font-size:.52rem; } .bld .top { width:30px; height:30px; } .city { height:260px; gap:4px; } .tower img { width:56px; top:-54px; }
    .bubbles { gap:12px; } .bub .gl { width:72px; height:72px; } .orbit { height:300px; } .planet .ball { width:48px; height:48px; } }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; } }
</style>
</head>
<body>
<div class="sw" role="group" aria-label="Look (test only)">
  <button type="button" data-l="L1" aria-pressed="true">1 · Space Station</button>
  <button type="button" data-l="L2" aria-pressed="false">2 · Glass Lab</button>
  <button type="button" data-l="L3" aria-pressed="false">3 · City at Night</button>
</div>

<section class="look on" id="L1">
  <canvas id="starsBg" aria-hidden="true"></canvas>
  <div class="in">
    <a class="back" href="agent-hub-circuit-test.html">← All agents</a>
    <div class="orbit" id="orbit"><span class="path"></span><img class="core" src="brand/logo-cube-v2.png" alt=""></div>
    <div class="info" data-info></div>
    <div class="head"><span class="k" data-cat></span><h1 data-name></h1><p data-blurb></p></div>
    <div class="chat" data-chat><div class="log" data-log></div><div class="starters" data-starters></div><form class="ask" data-form><input type="text" placeholder="Type your move…" aria-label="Message"><button type="submit">Send</button></form></div>
  </div>
</section>

<section class="look" id="L2">
  <div class="in">
    <a class="back" href="agent-hub-circuit-test.html">← All agents</a>
    <div class="disc"><img src="brand/logo-cube-v2.png" alt=""></div>
    <div class="head"><span class="k" data-cat></span><h1 data-name></h1><p data-blurb></p></div>
    <div class="bubbles" id="bubbles"></div>
    <div class="info" data-info></div>
    <div class="chat" data-chat><div class="log" data-log></div><div class="starters" data-starters></div><form class="ask" data-form><input type="text" placeholder="Type your move…" aria-label="Message"><button type="submit">Send</button></form></div>
  </div>
</section>

<section class="look" id="L3">
  <span class="moon"></span>
  <div class="in">
    <a class="back" href="agent-hub-circuit-test.html">← All agents</a>
    <div class="city" id="city"></div>
    <div class="info" data-info></div>
    <div class="head"><span class="k" data-cat></span><h1 data-name></h1><p data-blurb></p></div>
    <div class="chat" data-chat style="margin-top:16px"><div class="log" data-log></div><div class="starters" data-starters></div><form class="ask" data-form><input type="text" placeholder="Type your move…" aria-label="Message"><button type="submit">Send</button></form></div>
  </div>
</section>

<script>
(function () {
  var A = { name: "Text Adventure", cat: "Fun", blurb: "An interactive story game where you choose what happens.",
    starters: ["Start a fantasy adventure", "Space survival game", "Mystery in a haunted house"] };
  var MORE = [
    ["Brain Guide", "Explains the science behind everything in the 3D brain.", "#5aa2ff", '<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a2 2 0 0 0-3-1z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/>'],
    ["Quiz Master", "Runs quizzes on any topic and keeps score.", "#b48cff", '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6V14"/><path d="M12 17h.01"/>'],
    ["Riddle Master", "Riddles and brain teasers to test your wits.", "#3ddc97", '<path d="M4 8h4a2 2 0 1 1 4 0h4v4a2 2 0 1 1 0 4v4H4v-4a2 2 0 1 0 0-4z"/>'],
    ["Joke Writer", "Clean, clever jokes for any topic.", "#ff6b9d", '<circle cx="12" cy="12" r="9"/><path d="M8 14c1 1.6 2.4 2.4 4 2.4s3-.8 4-2.4"/><path d="M8.5 9.5h.01M15.5 9.5h.01"/>'],
    ["Debate Partner", "Argues the other side to sharpen your thinking.", "#4fd1ff", '<path d="M4 5h10v7H8l-4 3z"/><path d="M14 9h6v7l-3-2h-6v-2"/>'],
    ["Name Generator", "Names for pets, babies, characters, teams and more.", "#ff8a4c", '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>']
  ];
  function icon(m) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + m[3] + "</svg>"; }

  function setInfo(root, i) {
    var box = root.querySelector("[data-info]");
    if (i < 0) { box.classList.remove("on"); box.innerHTML = '<span class="tip">Tap one to meet another agent</span>'; return; }
    var m = MORE[i]; box.classList.add("on");
    box.innerHTML = '<p><b></b><br><span></span></p><a href="#">Open →</a>';
    box.querySelector("b").textContent = m[0]; box.querySelector("span").textContent = m[1];
  }

  function chat(root, onTalk) {
    root.querySelectorAll("[data-name]").forEach(function (e) { e.textContent = A.name; });
    root.querySelectorAll("[data-cat]").forEach(function (e) { e.textContent = A.cat + " · Free AI agent"; });
    root.querySelectorAll("[data-blurb]").forEach(function (e) { e.textContent = A.blurb; });
    setInfo(root, -1);
    var log = root.querySelector("[data-log]"), form = root.querySelector("[data-form]"), input = form.querySelector("input"), busy = false;
    log.innerHTML = '<p class="hint">Say hi, or tap an idea to begin.</p>';
    function add(k, t) { var h = log.querySelector(".hint"); if (h) h.remove(); var d = document.createElement("div"); d.className = "msg " + k; d.textContent = t; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
    function send(t) {
      t = String(t || "").trim(); if (!t || busy) return; busy = true; add("you", t); input.value = "";
      var reply = "(Preview) " + A.name + " would answer here. Real answers appear on the live site.", d = add("bot", ""), i = 0;
      var iv = setInterval(function () { i += 2; d.textContent = reply.slice(0, i); if (i >= reply.length) { clearInterval(iv); busy = false; } }, 18);
    }
    form.addEventListener("submit", function (e) { e.preventDefault(); send(input.value); });
    var st = root.querySelector("[data-starters]");
    A.starters.forEach(function (s) { var b = document.createElement("button"); b.type = "button"; b.textContent = s; b.onclick = function () { send(s); }; st.appendChild(b); });
  }
  ["L1", "L2", "L3"].forEach(function (id) { chat(document.getElementById(id)); });

  // ---------- 1 · Space Station: twinkling stars + planets circling the cube ----------
  var L1 = document.getElementById("L1"), cv = document.getElementById("starsBg"), cx2 = cv.getContext("2d"), dots = [];
  function sizeStars() { cv.width = L1.clientWidth; cv.height = L1.clientHeight; dots = []; for (var k = 0; k < 160; k++) dots.push({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: Math.random() * 1.4 + .2, p: Math.random() * 6 }); }
  var orbit = document.getElementById("orbit"), planets = [], spin = 0, target = null, sel = -1;
  MORE.forEach(function (m, i) {
    var b = document.createElement("button"); b.type = "button"; b.className = "planet"; b.style.setProperty("--p", m[2]);
    b.innerHTML = '<span class="ball">' + icon(m) + '</span><span class="name"></span>'; b.querySelector(".name").textContent = m[0];
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      if (sel === i) { sel = -1; target = null; } else { sel = i; var base = i * Math.PI * 2 / MORE.length; target = Math.PI / 2 - base; while (target < spin - Math.PI) target += Math.PI * 2; while (target > spin + Math.PI) target -= Math.PI * 2; }
      planets.forEach(function (p, k) { p.classList.toggle("on", k === sel); }); setInfo(L1, sel);
    });
    orbit.appendChild(b); planets.push(b);
  });
  orbit.addEventListener("click", function () { sel = -1; target = null; planets.forEach(function (p) { p.classList.remove("on"); }); setInfo(L1, -1); });
  var last = 0;
  function frame(t) {
    var dt = Math.min(50, t - last || 16); last = t;
    if (L1.classList.contains("on")) {
      cx2.clearRect(0, 0, cv.width, cv.height);
      dots.forEach(function (d) { var a = .35 + .65 * Math.abs(Math.sin(t / 900 + d.p)); cx2.fillStyle = "rgba(220,230,255," + a.toFixed(2) + ")"; cx2.beginPath(); cx2.arc(d.x, d.y, d.r, 0, 6.3); cx2.fill(); });
      if (target === null) spin += dt * 0.00018; else spin += (target - spin) * 0.08;
      var W = orbit.clientWidth, H = orbit.clientHeight, rx = W * 0.42, ry = H * 0.26, ox = W / 2, oy = H / 2;
      planets.forEach(function (p, i) {
        var a = spin + i * Math.PI * 2 / MORE.length, s = Math.sin(a), depth = (s + 1) / 2;
        var sc = 0.62 + depth * 0.55 + (i === sel ? 0.25 : 0);
        p.style.transform = "translate(" + (ox + Math.cos(a) * rx - p.offsetWidth / 2) + "px," + (oy + s * ry - p.offsetHeight / 2) + "px) scale(" + sc.toFixed(3) + ")";
        p.style.zIndex = s > 0 ? 60 + Math.round(depth * 10) : Math.round(depth * 40);
        p.style.opacity = (0.45 + depth * 0.55).toFixed(2);
      });
    }
    requestAnimationFrame(frame);
  }
  sizeStars(); requestAnimationFrame(frame); window.addEventListener("resize", sizeStars);

  // ---------- 2 · Glass Lab: wobbly glass bubbles ----------
  var L2 = document.getElementById("L2"), bubs = document.getElementById("bubbles"), sel2 = -1;
  MORE.forEach(function (m, i) {
    var b = document.createElement("button"); b.type = "button"; b.className = "bub"; b.style.setProperty("--p", m[2]);
    b.innerHTML = '<span class="gl">' + icon(m) + '</span><b></b>'; b.querySelector("b").textContent = m[0];
