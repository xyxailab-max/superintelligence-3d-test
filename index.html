</style></head><body><div id="loading">Preparing your 3D universe…</div><div id="error"></div><div id="ui"><div id="header"><div id="brand">✦ UseSuperintelligence</div><div id="topactions"><button id="cinema" class="pill">▶ Cinematic</button><button id="reset" class="pill">↺ Restart</button></div></div><div id="caption">Three worlds. One intelligence. Your next chapter.</div><div id="welcome"><h1>Choose Your Explorer</h1><p>Pick your character. Both explore the same universe.</p><div class="choices"><button class="choice" data-avatar="a"><span>◉</span>Explorer 01</button><button class="choice" data-avatar="b"><span>◉</span>Explorer 02</button></div><p style="font-size:12px;margin-bottom:0">Touch joystick to walk · Drag anywhere else to look around</p></div><div id="controls" hidden><div id="stick"><div id="knob"></div></div><div id="right"><span id="hint">Drag screen to orbit<br>Walk toward a portal</span><button id="enter" class="pill">ENTER WORLD →</button></div></div><div id="status"></div></div>

(function(){'use strict';const $=id=>document.getElementById(id);if(!window.THREE){$('loading').hidden=true;$('error').style.display='block';$('error').textContent='3D library could not load. Open this preview with an internet connection in Safari.';return}let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});}catch(e){$('loading').hidden=true;$('error').style.display='block';$('error').textContent='3D graphics are not available in this browser.';return}renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;document.body.insertBefore(renderer.domElement,$('ui'));
const scene=new THREE.Scene();scene.background=new THREE.Color('#cdeaff');scene.fog=new THREE.FogExp2('#dce7ff',.009);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,700);scene.add(new THREE.HemisphereLight('#ffffff','#8a9aca',2));const sun=new THREE.DirectionalLight('#fff5df',2.5);sun.position.set(-20,35,25);scene.add(sun);const fill=new THREE.DirectionalLight('#7ba7ff',1.2);fill.position.set(25,20,-20);scene.add(fill);
const mat=(c,metal=0,rough=.45)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough});const white=mat('#f7fbff',.35,.25),silver=mat('#dce9ff',.5,.2),floor=mat('#d9edff',.3,.22);function mesh(g,m,x=0,y=0,z=0,parent=scene){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);parent.add(o);return o}function cyl(rt,rb,h,m,x,y,z){return mesh(new THREE.CylinderGeometry(rt,rb,h,32),m,x,y,z)}function sphere(r,m,x,y,z,parent){return mesh(new THREE.SphereGeometry(r,20,14),m,x,y,z,parent)}function glow(c){return new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.75,depthWrite:false})}function ring(radius,tube,m,x,y,z,rotation=0){let o=mesh(new THREE.TorusGeometry(radius,tube,10,72),m,x,y,z);o.rotation.x=rotation;return o}

mesh(new THREE.BoxGeometry(15,.55,95),floor,0,-.34,10);for(let i=-1;i<=1;i+=2){mesh(new THREE.BoxGeometry(.12,.12,95),glow('#77d5ff'),i*7.3,.06,10);for(let z=-30;z<57;z+=6){sphere(.16,glow('#b99cff'),i*7.2,.28,z)}}cyl(37,37,1.3,white,0,-1,-43);ring(29,.2,glow('#98d6ff'),0,-.25,-43,Math.PI/2);for(let i=0;i<24;i++){let a=i*Math.PI/12,r=34;sphere(1.6,mat(i%2?'#c5a6ff':'#9cd6ff'),Math.cos(a)*r,2,Math.sin(a)*r-43)}
// Stylized brain floating behind the gates.
const brain=new THREE.Group();brain.position.set(0,17,-75);scene.add(brain);const brainMat=new THREE.MeshPhysicalMaterial({color:'#99caff',emissive:'#667cff',emissiveIntensity:.55,transparent:true,opacity:.8,roughness:.15,metalness:.25});for(let s of [-1,1])for(let i=0;i<24;i++){let a=i*2.399,rr=Math.sqrt((i+.5)/24);let x=s*(2.6+Math.cos(a)*rr*5),y=Math.sin(a)*rr*5,z=Math.cos(a*.7)*2.5;sphere(1.7+Math.random()*.7,brainMat,x,y,z,brain)}for(let i=0;i<5;i++){let r=ring(8+i*.55,.035,glow(i%2?'#9e83ff':'#67d9ff'),0,0,0);brain.add(r);r.position.set(0,0,0);r.rotation.y=i*.55}
// Three arch portals, with visible world scenery inside each.
const portals=[{name:'FOR CREATORS',c:'#a45eff',x:-18,link:'marketplace.html#sell'},{name:'MARKETPLACE',c:'#f5b93e',x:0,link:'marketplace.html'},{name:'AGENT HUB',c:'#32a9ff',x:18,link:'agents.html'}];let gateMeshes=[];const archPath=new THREE.CatmullRomCurve3([new THREE.Vector3(-6,0,0),new THREE.Vector3(-6,7,0),new THREE.Vector3(-4.8,12,0),new THREE.Vector3(0,14,0),new THREE.Vector3(4.8,12,0),new THREE.Vector3(6,7,0),new THREE.Vector3(6,0,0)]);for(const p of portals){let g=new THREE.Group();g.position.set(p.x,0,-43);scene.add(g);let arch=mesh(new THREE.TubeGeometry(archPath,80,.38,12,false),white,0,0,0,g);let bright=mesh(new THREE.TubeGeometry(archPath,80,.14,8,false),glow(p.c),0,0,.45,g);let inside=mesh(new THREE.PlaneGeometry(11.7,13.7),new THREE.MeshBasicMaterial({color:p.c,transparent:true,opacity:.22,side:THREE.DoubleSide,depthWrite:false}),0,6.7,-.4,g);inside.material.opacity=.18;for(let j=0;j<30;j++){let x=(Math.random()-.5)*10,y=1+Math.random()*12;let star=sphere(.08+Math.random()*.1,glow(p.c),x,y,-.1,g);star.userData.phase=Math.random()*7}let plinth=mesh(new THREE.BoxGeometry(13,.45,3),silver,0,.05,1.4,g);ring(6.7,.06,glow(p.c),0,7,-.1);gateMeshes.push({g,p,inside,bright});}
// Readable labels using canvas textures.
function label(text,c){const c2=document.createElement('canvas');c2.width=1024;c2.height=170;const cx=c2.getContext('2d');cx.fillStyle='rgba(255,255,255,.9)';cx.beginPath();cx.roundRect(6,6,1012,158,45);cx.fill();cx.strokeStyle=c;cx.lineWidth=12;cx.stroke();cx.fillStyle='#29477d';cx.font='bold 76px system-ui';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(text,512,88);const tx=new THREE.CanvasTexture(c2);tx.encoding=THREE.sRGBEncoding;return new THREE.MeshBasicMaterial({map:tx,transparent:true,depthWrite:false})}for(const o of gateMeshes)mesh(new THREE.PlaneGeometry(10,1.65),label(o.p.name,o.p.c),0,15.8,1,o.g);
// Decorative gardens and floating architecture.
for(let side of [-1,1])for(let i=0;i<7;i++){let z=-52+i*13,x=side*(15+i%2*3);cyl(4.5,4.8,.7,white,x,1.5,z);cyl(.55,.8,3,white,x,3.2,z);sphere(2.5,mat(i%2?'#f5a9df':'#b9a5ff'),x,5.6,z);sphere(1.4,mat('#9fe0ba'),x+1.6,5,z+1);}
const avatar=new THREE.Group();scene.add(avatar);const suit=mat('#f5faff',.2,.4),hairA=mat('#443565'),hairB=mat('#624636'),skin=mat('#f2bda1'),trim=glow('#6faaff');function createAvatar(which){avatar.clear();avatar.position.set(0,0,28);const body=mesh(new THREE.CylinderGeometry(.48,.72,2.2,10),suit,0,2.3,0,avatar);const head=sphere(.58,skin,0,3.85,0,avatar);sphere(.61,which==='a'?hairA:hairB,0,4.15,-.08,avatar);if(which==='a')mesh(new THREE.CylinderGeometry(.47,.28,1.45,12),hairA,0,3.5,-.35,avatar);for(let s of [-1,1]){mesh(new THREE.CylinderGeometry(.19,.22,1.8,8),suit,s*.32,.95,0,avatar);let arm=mesh(new THREE.CylinderGeometry(.17,.2,1.65,8),suit,s*.72,2.5,0,avatar);arm.rotation.z=s*.14;}mesh(new THREE.BoxGeometry(1.1,.13,.7),trim,0,2.55,-.42,avatar);avatar.rotation.y=Math.PI;}
let chosen=false,cinematic=false,cinemaT=0,orbit=0,camPitch=.22,walk={x:0,y:0},selected=null;const clock=new THREE.Clock();function setCinematic(){cinematic=true;cinemaT=0;$('cinema').textContent='Skip Intro';$('caption').textContent='Your journey begins…';}document.querySelectorAll('[data-avatar]').forEach(b=>b.addEventListener('click',()=>{createAvatar(b.dataset.avatar);chosen=true;$('welcome').hidden=true;$('controls').hidden=false;setCinematic();}));$('cinema').addEventListener('click',()=>{if(!chosen)return;if(cinematic){cinematic=false;$('cinema').textContent='▶ Cinematic';$('caption').textContent='Explore the three worlds';}else setCinematic()});$('reset').addEventListener('click',()=>{chosen=false;cinematic=false;$('welcome').hidden=false;$('controls').hidden=true;avatar.visible=false;$('status').textContent='';$('enter').style.display='none';});$('enter').addEventListener('click',()=>{if(selected){$('status').textContent=selected.name+' — prototype destination';$('caption').textContent='In the full website, this opens '+selected.name+'.';}});
const stick=$('stick'),knob=$('knob');let activePointer=null;function moveStick(e){let r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.hypot(x,y),max=35;if(d>max){x*=max/d;y*=max/d}knob.style.transform=`translate(${x}px,${y}px)`;walk.x=x/max;walk.y=-y/max}stick.addEventListener('pointerdown',e=>{activePointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===activePointer)moveStick(e)});function stop(e){if(e.pointerId===activePointer){activePointer=null;walk.x=walk.y=0;knob.style.transform=''}}stick.addEventListener('pointerup',stop);stick.addEventListener('pointercancel',stop);let drag=null;renderer.domElement.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId||cinematic)return;orbit-=(e.clientX-drag.x)*.005;camPitch=THREE.MathUtils.clamp(camPitch+(e.clientY-drag.y)*.003,-.08,.7);drag.x=e.clientX;drag.y=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=null);const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
const v=new THREE.Vector3(),look=new THREE.Vector3();function frame(){requestAnimationFrame(frame);let dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;brain.rotation.y=Math.sin(t*.2)*.12;for(let i=0;i<gateMeshes.length;i++){let o=gateMeshes[i];o.inside.material.opacity=.19+Math.sin(t*1.7+i)*.055;o.bright.material.opacity=.65+Math.sin(t*2+i)*.3;}if(chosen){avatar.visible=true;if(cinematic){cinemaT+=dt;let progress=Math.min(cinemaT/7.5,1),ease=progress*progress*(3-2*progress);avatar.position.z=28-ease*57;avatar.position.x=Math.sin(progress*Math.PI)*2;camera.position.lerp(v.set(avatar.position.x+7*(1-ease),5.5+7*(1-ease),avatar.position.z+12+14*(1-ease)),.045);look.set(avatar.position.x,3,-43);camera.lookAt(look);if(progress>=1){cinematic=false;$('cinema').textContent='▶ Cinematic';$('caption').textContent='Move toward a portal · Swipe to look around';}}else{let mx=walk.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=walk.y+(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);let speed=dt*8;avatar.position.x=THREE.MathUtils.clamp(avatar.position.x+mx*speed,-30,30);avatar.position.z=THREE.MathUtils.clamp(avatar.position.z-my*speed,-58,38);if(Math.abs(mx)+Math.abs(my)>.08)avatar.rotation.y=Math.atan2(-mx,-my);let dist=11,dx=Math.sin(orbit)*dist,dz=Math.cos(orbit)*dist;v.set(avatar.position.x+dx,avatar.position.y+5.5+camPitch*10,avatar.position.z+dz);camera.position.lerp(v,.09);look.set(avatar.position.x,2.6,avatar.position.z-2);camera.lookAt(look);}let best=null,bestDist=9;for(let p of portals){let d=Math.hypot(avatar.position.x-p.x,avatar.position.z+43);if(d<bestDist){best=p;bestDist=d}}selected=best;$('enter').style.display=best&&!cinematic?'block':'none';$('status').textContent=best&&!cinematic?'✦ '+best.name:'';}else{avatar.visible=false;camera.position.set(0,20,58);camera.lookAt(0,7,-43)}renderer.render(scene,camera)}$('loading').hidden=true;frame();})();
