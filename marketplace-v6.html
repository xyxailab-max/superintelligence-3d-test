addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x;if(!drag.moved&&Math.abs(dx)>6){drag.moved=true;g.classList.add('dragging')}if(!drag.moved)return;
const unit=cw*.85,dt=Math.max(1,e.timeStamp-drag.lt),v=-(e.clientX-drag.lx)/unit/dt;vel=vel*.6+v*.4;drag.lx=e.clientX;drag.lt=e.timeStamp;let p=drag.p-dx/unit;if(!loop())p=Math.max(-.35,Math.min(n-.65,p));pos=p;if(!raf)raf=requestAnimationFrame(tick)},{passive:true});
const end=e=>{if(!drag||e.pointerId!==drag.id)return;const m=drag.moved;drag=null;g.classList.remove('dragging');if(m){justDragged=true;setTimeout(()=>justDragged=false,0);target=clampT(Math.round(pos+Math.max(-2.5,Math.min(2.5,vel*260))));run()}};
addEventListener('pointerup',end);addEventListener('pointercancel',end);
g.addEventListener('dragstart',e=>e.preventDefault());
nav.addEventListener('click',e=>{const b=e.target.closest('.arr');if(b)step(Number(b.dataset.d))});
g.addEventListener('click',e=>{if(justDragged){e.preventDefault();e.stopImmediatePropagation();return}const c=e.target.closest('.product');if(c&&!c.classList.contains('on')){e.preventDefault();e.stopImmediatePropagation();go(cs.indexOf(c))}},true);
addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.target===search)return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
const fit=()=>{const c=g.querySelector('.product .info'),ih=c?c.offsetHeight:150,h=g.clientHeight-40;cw=Math.max(180,Math.min(380,innerWidth*.62,(h-ih)*360/464));g.style.setProperty('--cw',cw+'px');lay()};
const refresh=()=>{cs=cards();n=cs.length;pos=target=0;vel=0;dots.innerHTML=cs.map(()=>'<i></i>').join('');requestAnimationFrame(fit)};
new MutationObserver(refresh).observe(g,{childList:true});addEventListener('resize',()=>requestAnimationFrame(fit));refresh()})();
</script>
</body></html>
